- generic [active] [ref=f9e1]: "{ \"s1\": \"Tôi vẫn mua hai phần ăn theo thói quen. Đến lúc tính tiền mới nhớ giờ chỉ còn mình.\", \"s2\": \"Về đến nhà, giá đỡ có hai bàn chải. Một cái khô, một cái còn ướt.\", \"s3\": \"Bàn ăn vẫn kê hai ghế. Tôi gõ: Ăn gì chưa. Rồi xoá từng chữ.\", \"s4a\": \"Có một tối, tôi đứng lại trước quầy.\", \"s4b\": \"Không hẳn vì tiếc. Mà vì tôi quên mất một phần ăn thì trông thế nào.\", \"s5\": \"Hai hộp nằm sẵn trên quầy. Tay tôi dừng trên hộp thứ hai. Rồi tôi nói: một phần thôi.\", \"s6\": \"Tôi mang một hộp về. Ngồi xuống, mở nắp, hơi cơm bốc lên mặt. Ăn hết. Không thấy nhẹ người. Chỉ thấy no.\" }"