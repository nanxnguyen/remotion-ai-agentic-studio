name: Daily small habits - Vbee authentic voice
on:
  push:
    branches: [feat/thoi-quen-nho-moi-ngay-shorts]
    paths: [.github/workflows/daily-habits-vbee.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create real voice from saved Vbee secrets
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/thoi-quen-nho-moi-ngay/timeline.json \
            --out-dir public/audio/thoi-quen-nho-moi-ngay \
            --voice-code hn_male_phuthang_stor_24k-stl \
            --speed 1.04 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-habits-vbee-voice
          path: public/audio/thoi-quen-nho-moi-ngay/
          retention-days: 14
          if-no-files-found: error
