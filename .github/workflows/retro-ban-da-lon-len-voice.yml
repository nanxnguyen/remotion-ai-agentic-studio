name: Retro TV - Ban Da Lon Len - genuine Vbee Ngoc Huyen
on:
  push:
    branches:
      - feat/retro-ban-da-lon-len-20261030
    paths:
      - .github/workflows/retro-ban-da-lon-len-voice.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify Vbee access
        run: test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
      - name: Synthesize original five acts
        run: |
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/retro-ban-da-lon-len/voice.json \
            --out-dir build/retro-ban-da-lon-len/voice \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 1.08
      - name: Verify measured clips
        run: |
          test "$(find build/retro-ban-da-lon-len/voice -name 's*.mp3' | wc -l)" -eq 5
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("build/retro-ban-da-lon-len/voice")
          a=json.loads((p/"measured-timeline.json").read_text())
          assert len(a)==5 and all(t["audio_seconds"]>0.3 for t in a)
          for t in a: assert (p/t["audio_file"]).stat().st_size>200
          print([(x['id'],x['audio_seconds']) for x in a])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retro-ban-da-lon-len-vbee-ngoc-huyen
          path: build/retro-ban-da-lon-len/voice/
          retention-days: 14
          if-no-files-found: error
