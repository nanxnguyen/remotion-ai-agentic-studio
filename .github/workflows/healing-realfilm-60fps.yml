name: Healing Film V3 — REAL Footage 60fps & Vbee
on:
  push:
    branches: [feat/healing-film-real-footage-60fps]
    paths:
      - '.github/workflows/healing-realfilm-60fps.yml'
      - 'docs/healing-realfilm-60fps/scene_manifest.json'
      - 'docs/healing-realfilm-60fps/real_footage_render.py'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: healing-realfilm-60fps
  cancel-in-progress: false

jobs:
  realfilm:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HEALING_DIR: docs/healing-realfilm-60fps
      PREVIOUS_VBEE_DRIVE_FILE_ID: 1inhnYkQ1kTGzMWKDQbI5dn092-FlvXgg

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/healing-film-real-footage-60fps
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install FFmpeg, Pexels downloader dependencies and Google Drive downloader
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --quiet pillow gdown

      - name: Install authentic Be Vietnam Pro for clean native-Vietnamese cinematic text
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/share/fonts/bevietnam
          sudo curl -fLsS --retry 4 --max-time 90 \
            'https://raw.githubusercontent.com/bettergui/BeVietnamPro/main/fonts/ttf/BeVietnamPro-Bold.ttf' \
            -o /usr/local/share/fonts/bevietnam/BeVietnamPro-Bold.ttf
          sudo curl -fLsS --retry 4 --max-time 90 \
            'https://raw.githubusercontent.com/bettergui/BeVietnamPro/main/fonts/ttf/BeVietnamPro-Regular.ttf' \
            -o /usr/local/share/fonts/bevietnam/BeVietnamPro-Regular.ttf
          sudo fc-cache -f
          fc-match 'Be Vietnam Pro' -f '%{family}\n'
          test "$(stat -c %s /usr/local/share/fonts/bevietnam/BeVietnamPro-Bold.ttf)" -gt 100000

      - name: Retrieve verified user's genuine Vbee Thanh Long + piano track from public-shared Drive file
        run: |
          set -euo pipefail
          mkdir -p /tmp/real_healing_60fps
          python3 -m gdown "$PREVIOUS_VBEE_DRIVE_FILE_ID" \
            -O /tmp/real_healing_60fps/vbee_previous_92s.mp4
          test "$(stat -c %s /tmp/real_healing_60fps/vbee_previous_92s.mp4)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size:stream=codec_type \
            -of json /tmp/real_healing_60fps/vbee_previous_92s.mp4

      - name: Validate 18-shot editorial continuity contract
        run: |
          set -euo pipefail
          python3 -m py_compile "$HEALING_DIR/real_footage_render.py"
          python3 - <<'PY'
          import json
          p='docs/healing-realfilm-60fps/scene_manifest.json'
          a=json.load(open(p,encoding='utf8'))
          ss=a['scenes']
          assert len(ss)==18 and ss[0]['start']==0 and ss[-1]['end']==92
          assert all(ss[i]['end']==ss[i+1]['start'] for i in range(17))
          assert set(s['src'] for s in ss) <= set(a['stock'].keys())
          assert a['output']['fps']==60 and a['output']['width']==1920
          print('Editing contract OK, actors remain independent stock B-roll.')
          PY

      - name: Download licensed real-life footage and build entire 60fps cinematic monologue
        run: |
          set -euo pipefail
          python3 "$HEALING_DIR/real_footage_render.py"

      - name: Verify complete AV, 60fps, exact runtime, visual preview and source provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          base=Path('docs/healing-realfilm-60fps')
          data=json.loads((base/'QA-realfilm-60fps.json').read_text(encoding='utf8'))
          p=base/data['videoFile']
          assert p.exists() and p.stat().st_size>1000000
          q=json.loads(subprocess.check_output(['ffprobe','-v','error',
            '-show_entries','format=duration:stream=codec_type,avg_frame_rate,width,height',
            '-of','json',str(p)],text=True))
          assert abs(float(q['format']['duration'])-92.0)<.2
          assert {s['codec_type'] for s in q['streams']}=={'video','audio'}
          v=next(s for s in q['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'],v['avg_frame_rate'])==(1920,1080,'60/1')
          assert (base/'realfilm_60fps_contact_sheet.jpg').stat().st_size>100000
          print('Technical QA PASS:',data['sha256'],data['bytes'])
          print('Note: manual visual QA, single-actor continuity and all-native-60fps are NOT claimed.')
          PY

      - name: Archive source sheet, MP4 and QA without overwriting previous cinematic preview
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$HEALING_DIR/realfilm_v3_92s_60fps_VbeeThanhLong.mp4" \
            "$HEALING_DIR/realfilm_60fps_contact_sheet.jpg" \
            "$HEALING_DIR/QA-realfilm-60fps.json"
          git diff --cached --quiet || git commit -m 'assets(healing): archive 92s real-life B-roll cinematic video with Vbee 60fps'
          git fetch origin feat/healing-film-real-footage-60fps
          git rebase origin/feat/healing-film-real-footage-60fps
          git push origin HEAD:feat/healing-film-real-footage-60fps

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: healing-real-life-16x9-60fps-vbee
          path: |
            docs/healing-realfilm-60fps/realfilm_v3_92s_60fps_VbeeThanhLong.mp4
            docs/healing-realfilm-60fps/realfilm_60fps_contact_sheet.jpg
            docs/healing-realfilm-60fps/QA-realfilm-60fps.json
          retention-days: 7
          if-no-files-found: ignore
