name: One-time Umbrella existing upload verification

on:
  push:
    branches:
      - feat/one-shot-umbrella-private-20261104
    paths:
      - config/films/umbrella-verify-trigger.json

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'nanxnguyen/remotion-ai-agentic-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_OLISE_MAN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google API dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/youtube-multi-requirements.txt
      - name: Verify previously uploaded video status without modifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from googleapiclient.discovery import build
          from scripts.youtube_multi_channel import credentials, YT_SCOPES, resolve_channel
          youtube = build('youtube', 'v3', credentials=credentials(YT_SCOPES, os.environ['YOUTUBE_REFRESH_TOKEN']), cache_discovery=False)
          owner = resolve_channel(youtube, {'key':'OLISE_MAN','handle':'@olise-man','channel_id':'UCY3n3Nlqyo6uI4GU8nuX-5g'})
          video_id='Skas4K2mKYs'
          match='saf-f920b53ced5df3680b12868eea766c2ed'
          data = youtube.videos().list(part='snippet,status,contentDetails', id=video_id).execute()
          if len(data.get('items',[])) != 1:
              raise SystemExit('Previously-uploaded video not visible to the channel OAuth')
          item=data['items'][0]
          privacy=item.get('status',{}).get('privacyStatus')
          snippet=item.get('snippet',{})
          if snippet.get('channelId') != owner['id'] or privacy!='private' or match not in snippet.get('tags',[]):
              raise SystemExit('Owner/Privacy/SHA marker mismatch; video verification BLOCKED')
          result={'video_id':video_id,'channel_id':owner['id'],'privacy':privacy,'title':snippet.get('title'),
                  'status':'verified_existing_private', 'description_set':bool(snippet.get('description')),
                  'thumbnail_variants':sorted(snippet.get('thumbnails',{}).keys())}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          with open('umbrella-verify-receipt.json','w') as f: json.dump(result,f,ensure_ascii=False,indent=2)
          PY
      - name: Save verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbrella-existing-private-verification
          path: umbrella-verify-receipt.json
          if-no-files-found: ignore
          retention-days: 30
