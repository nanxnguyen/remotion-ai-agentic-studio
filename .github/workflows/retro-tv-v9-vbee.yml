name: V9 — Emotional Vbee for Locked Four-Act Film
on:
  push:
    branches: [feat/retro-tv-v9-growth-30s]
    paths: [.github/workflows/retro-tv-v9-vbee.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/retro-tv-v9-callback' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate four genuine Vbee Ngoc Huyen voice clips
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/retro-tv-v9/narration.json \
            --out-dir public/audio/retro-tv-v9 \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 1.12 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: retro-tv-v9-actual-vbee-voice
          path: public/audio/retro-tv-v9/
          if-no-files-found: error
          retention-days: 21
