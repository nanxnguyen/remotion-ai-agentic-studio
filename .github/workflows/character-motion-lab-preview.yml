name: Character Motion Lab Preview

on:
  pull_request:
    paths:
      - 'src/animation/**'
      - 'src/videos/character-motion-lab/**'
      - 'src/videos/registry.ts'
      - '.github/workflows/character-motion-lab-preview.yml'
  workflow_dispatch:

jobs:
  render-motion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all TypeScript
        run: npm run typecheck
      - name: Test the character motion invariants
        run: node --experimental-strip-types --test tests/core/character-motion.node.ts
      - name: Render diagnostic 10s MP4
        run: npx remotion render src/index.ts CharacterMotionLab out/character-motion-lab.mp4 --concurrency=2
      - name: Verify output is nonempty
        run: test -s out/character-motion-lab.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: character-motion-lab-preview
          path: out/character-motion-lab.mp4
          retention-days: 90
