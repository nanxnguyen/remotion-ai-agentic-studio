name: YouTube Shorts VI Profile Tests

on:
  pull_request:
    paths:
      - 'scripts/youtube_multi_channel.py'
      - 'tests/test_youtube_multi_channel.py'
      - '.github/workflows/youtube-horror-shorts-private.yml'
      - '.github/workflows/youtube-shorts-vi-profile-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shorts-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate uploader and Shorts VI profile (offline)
        run: |
          python -m compileall -q scripts/youtube_multi_channel.py
          python -m unittest discover -s tests -p 'test_youtube_multi_channel.py' -v
