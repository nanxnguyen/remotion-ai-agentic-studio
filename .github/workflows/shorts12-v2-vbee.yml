name: Shorts12 V2 Cinematic Emotional Thanh Long
on:
  push:
    branches: [feat/shorts12-v2-cinematic-voice]
    paths:
      - docs/shorts12-v2/narration.txt
      - .github/workflows/shorts12-v2-vbee.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vbee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Synthesize authentic Vbee Thanh Long
        env:
          VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
          VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN }}
          VBEE_WEBHOOK_URL: https://iehmucsshklgjmxqyggp.supabase.co/functions/v1/vbee-batch-callback
        run: |
          set -euo pipefail
          test -n "$VBEE_APP_ID" && test -n "$VBEE_ACCESS_TOKEN"
          mkdir -p output
          python3 .claude/skills/ray-emotional-stick-shorts/scripts/vbee_tts.py \
            --text-file docs/shorts12-v2/narration.txt \
            --voice-code hn_male_thanhlong_talk_48k-fhg \
            --speed 1.02 \
            --output output/shorts12-v2-thanhlong.mp3
          ffprobe -v error -show_entries stream=codec_name -show_entries format=duration -of json output/shorts12-v2-thanhlong.mp3 | tee output/ffprobe.json
          sha256sum output/shorts12-v2-thanhlong.mp3 > output/voice.sha256
          test "$(stat -c%s output/shorts12-v2-thanhlong.mp3)" -gt 10000
      - name: Preserve authentic Vbee voice as private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts12-v2-thanhlong
          path: output/
          retention-days: 30
          if-no-files-found: error
