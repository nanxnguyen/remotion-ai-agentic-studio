name: Horror Factory - Capability Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-factory-capability-audit.yml'
      - 'scripts/horror_factory_capabilities.py'
      - 'scripts/horror_factory_run.py'
      - 'scripts/gen-story-vbee-batch.py'
      - 'scripts/youtube_multi_channel.py'
      - 'scripts/horror_archive_oauth.py'
      - 'scripts/youtube_oauth_setup.py'
      - 'tests/test_horror_archive_oauth.py'
      - 'tests/test_horror_factory_capabilities.py'

permissions:
  contents: read

jobs:
  capability-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HEM_CHUYEN_LA }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools used by the queue executor
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG>=2.7,<3'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Verify readiness regression tests
        run: python -m unittest discover -s tests -p 'test_horror*.py' -v
      - name: Inspect current phase capabilities without publishing
        run: python scripts/horror_factory_capabilities.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horror-factory-capability-report
          path: horror-factory-capability-audit.json
          if-no-files-found: ignore
          retention-days: 14

