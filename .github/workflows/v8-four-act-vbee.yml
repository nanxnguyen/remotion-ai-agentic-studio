name: V8 - Four-act fast motivational Vbee
on:
  push:
    branches: [feat/retro-tv-v8-fast-four-act]
    paths: [.github/workflows/v8-four-act-vbee.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/v8-story-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate genuine female Vbee 4-act narration
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/retro-tv-v8-fast/narration.json \
            --out-dir public/audio/retro-tv-v8-fast \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 1.13 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: retro-tv-v8-fast-4-act-real-vbee
          path: public/audio/retro-tv-v8-fast/
          if-no-files-found: error
          retention-days: 14
