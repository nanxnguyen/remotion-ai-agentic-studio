name: Ray cinematic storytelling preflight tests
on:
  push:
    paths:
      - '.claude/skills/ray-phim-ke-chuyen/**'
      - 'tests/test_ray_story_preflight.py'
      - '.github/workflows/ray-cinematic-preflight.yml'
  pull_request:
    paths:
      - '.claude/skills/ray-phim-ke-chuyen/**'
      - 'tests/test_ray_story_preflight.py'
      - '.github/workflows/ray-cinematic-preflight.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preflight validator and sample production plan
        run: |
          python3 -m unittest discover -s tests -p 'test_ray_story_preflight.py' -v
          python3 .claude/skills/ray-phim-ke-chuyen/scripts/preflight_story_video.py \
            --timeline .claude/skills/ray-phim-ke-chuyen/templates/preflight-storyboard.json \
            --max-seconds 60
