name: Recover Ma Da Keo Gio Vbee s05
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ma-da-keo-gio-vbee-s05-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-voice-s05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://iehmucsshklgjmxqyggp.supabase.co/functions/v1/vbee-batch-callback' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate missing authentic Vbee s05 only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          p=Path('scripts/gen-story-vbee-batch.py')
          spec=importlib.util.spec_from_file_location('vbee_batch',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert os.environ.get('VBEE_APP_ID') and os.environ.get('VBEE_ACCESS_TOKEN')
          timeline=json.loads(Path('docs/ma-da-keo-gio/voice-vbee-ngan-timeline.json').read_text())
          r=next(x for x in timeline if x['id']==5)
          assert r['narration']=='Cứu tôi!'
          out=Path('output/ma-da-keo-gio-vbee-ngan-s05');out.mkdir(parents=True,exist_ok=True)
          f=out/'s05.mp3'
          voice='n_hn_male_ngankechuyen_ytstable_vc'
          m.generate_async(r['narration'],voice,1.03,f,os.environ['VBEE_WEBHOOK_URL'])
          d=m.read_duration(f)
          assert 0.2<=d<=15
          record={**r,'audio_file':f.name,'voice_code':voice,'audio_seconds':round(d,3),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
          (out/'s05.json').write_text(json.dumps(record,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUCCESS authentic Vbee voice s05 duration',round(d,3))
          PY
      - name: Upload recovered Vbee voice artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-da-keo-gio-vbee-s05
          path: output/ma-da-keo-gio-vbee-ngan-s05/
          if-no-files-found: warn
          retention-days: 14
