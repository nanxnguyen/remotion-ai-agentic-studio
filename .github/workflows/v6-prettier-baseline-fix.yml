name: Fix V6 PR formatting debt
on:
  push:
    branches: ["feat/khong-ai-vo-tay-v6-gate1-20261031"]
    paths: [".github/workflows/v6-prettier-baseline-fix.yml"]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format exact scope of existing repository gate
        run: npx prettier --write README.md AGENTS.md src/core src/videos tests/core tests/cli scripts/video-new.mjs scripts/validate-assets.mjs scripts/measure-voice.mjs
      - name: Commit formatted sources to V6 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md src/core src/videos tests/core tests/cli scripts/video-new.mjs scripts/validate-assets.mjs scripts/measure-voice.mjs
          if git diff --cached --quiet; then
            echo "Prettier format check already clean"
          else
            git commit -m "style: normalize existing Prettier baseline for V6 CI"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
