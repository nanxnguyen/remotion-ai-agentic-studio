name: Vbee voice provider capabilities (safe check)
on:
  push:
    branches: [feat/vbee-voice-stick-shorts]
    paths: ['.github/workflows/vbee-audition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vbee secrets exist (never print values)
        env:
          VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
          VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$VBEE_APP_ID" || -z "$VBEE_ACCESS_TOKEN" ]]; then
            echo "::warning::Vbee API secrets missing; Studio export route remains available."
          else
            echo "App ID and token secrets configured."
          fi
          echo "Vbee real-time unsupported by connected plan as of 2026-10-23 (HTTP 400)."
          echo "Male Batch API requires webhookUrl. User chose not to configure one."
          echo "Use Vbee Studio manual MP3/WAV export; do not synthesize/retry paid API automatically."
