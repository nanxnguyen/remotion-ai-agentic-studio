name: Temporary Silent Factory Prettier Fix
on:
  push:
    paths:
      - ".format-silent-factory-trigger2"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/videos/silent-factory-longform/Reel.tsx
      - name: Commit formatted composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/videos/silent-factory-longform/Reel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(silent-factory): apply Prettier formatting"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: silent-factory-prettier-fixed
          path: src/videos/silent-factory-longform/Reel.tsx
          retention-days: 1
