name: Archive finished story video

on:
  workflow_dispatch:
    inputs:
      video_slug:
        description: Lowercase video slug (e.g. room404-vbee)
        required: true
        type: string
      source_run_id:
        description: GitHub Actions run ID containing the approved final MP4 artifact
        required: true
        type: string
      artifact_name:
        description: Name of the artifact containing exactly one final MP4
        required: true
        default: final-video
        type: string
      qa_approved:
        description: Confirm final MP4 has passed visual, voice, music and caption QA
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      video_slug:
        required: true
        type: string
      source_run_id:
        required: false
        type: string
        default: ""
      artifact_name:
        required: false
        type: string
        default: final-video
      qa_approved:
        required: true
        type: boolean

    outputs:
      release_url:
        description: Verified GitHub draft Release URL (requires repository access)
        value: ${{ jobs.archive.outputs.release_url }}
      video_url:
        description: Verified MP4 asset URL in GitHub Release (may require login)
        value: ${{ jobs.archive.outputs.video_url }}
      sha256:
        description: SHA-256 of the archived final MP4
        value: ${{ jobs.archive.outputs.sha256 }}

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ inputs.qa_approved }}
    outputs:
      release_url: ${{ steps.verify_archive.outputs.release_url }}
      video_url: ${{ steps.verify_archive.outputs.video_url }}
      sha256: ${{ steps.verify_archive.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VIDEO_SLUG: ${{ inputs.video_slug }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify IDs and download approved artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VIDEO_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::Invalid video_slug"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid source_run_id"; exit 1; }
          [[ "$ARTIFACT_NAME" =~ ^[a-zA-Z0-9_.-]+$ ]] || { echo "::error::Invalid artifact_name"; exit 1; }
          mkdir -p "$RUNNER_TEMP/video-archive"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/video-archive"
          mapfile -d '' -t mp4s < <(find "$RUNNER_TEMP/video-archive" -type f -iname '*.mp4' -print0)
          if (( ${#mp4s[@]} != 1 )); then
            echo "::error::Artifact must contain exactly one final MP4"
            exit 1
          fi
          cp -- "${mp4s[0]}" "$RUNNER_TEMP/$VIDEO_SLUG-final.mp4"
          ffprobe -v error -show_format -show_streams -of json "$RUNNER_TEMP/$VIDEO_SLUG-final.mp4" > "$RUNNER_TEMP/probe.json"
          python3 - "$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/$VIDEO_SLUG-final.mp4" <<'PY'
          import json, sys, os
          meta=json.load(open(sys.argv[1],encoding="utf-8"))
          streams=meta.get("streams",[])
          video=[x for x in streams if x.get("codec_type")=="video"]
          audio=[x for x in streams if x.get("codec_type")=="audio"]
          if not video or not audio: raise SystemExit("Final MP4 must contain both video and narration audio")
          if video[0].get("codec_name")!="h264" or audio[0].get("codec_name")!="aac":
              raise SystemExit("Final MP4 must use H.264 video and AAC audio")
          v=video[0]; w=int(v.get("width",0)); h=int(v.get("height",0))
          if not (h>w>0): raise SystemExit("Expected vertical video")
          duration=float(meta.get("format",{}).get("duration",0))
          if duration<=0 or os.path.getsize(sys.argv[2])<100000:
              raise SystemExit("Empty, corrupt, or zero-duration MP4")
          print(f"Validated final MP4: {w}x{h}, {duration:.2f}s, video+audio")
          PY
      - name: Store final binary in a draft GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          MP4="$RUNNER_TEMP/$VIDEO_SLUG-final.mp4"
          META="$RUNNER_TEMP/$VIDEO_SLUG-metadata.json"
          TAG="video-$VIDEO_SLUG-run-$SOURCE_RUN_ID"
          HASH="$(sha256sum "$MP4" | cut -d' ' -f1)"
          export MP4 META TAG HASH
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          probe=json.loads(Path(os.environ["RUNNER_TEMP"],"probe.json").read_text())
          vs=next(x for x in probe["streams"] if x.get("codec_type")=="video")
          a=next(x for x in probe["streams"] if x.get("codec_type")=="audio")
          data={
              "video_slug":os.environ["VIDEO_SLUG"],
              "source_run_id":os.environ["SOURCE_RUN_ID"],
              "source_artifact":os.environ["ARTIFACT_NAME"],
              "release_tag":os.environ["TAG"],
              "sha256":os.environ["HASH"],
              "duration_seconds":float(probe["format"]["duration"]),
              "width":int(vs["width"]),"height":int(vs["height"]),
              "video_codec":vs["codec_name"],"audio_codec":a["codec_name"],
              "status":"archived-draft-release","qa_approved_in_workflow":True,
          }
          Path(os.environ["META"]).write_text(json.dumps(data,indent=2)+"\n")
          PY
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Finished story video: $VIDEO_SLUG" \
              --target "$GITHUB_SHA" \
              --notes "QA-approved original final video from Actions run $SOURCE_RUN_ID. SHA-256: $HASH. Draft archive, not publication."
          fi
          gh release upload "$TAG" "$MP4" "$META" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url

      - name: Verify release asset and record real GitHub download link
        id: verify_archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="video-$VIDEO_SLUG-run-$SOURCE_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          info=json.loads((root/"release.json").read_text(encoding="utf-8"))
          slug=os.environ["VIDEO_SLUG"]
          mp4=root/f"{slug}-final.mp4"
          sha=hashlib.sha256(mp4.read_bytes()).hexdigest()
          name=f"{slug}-final.mp4"
          matches=[a for a in info.get("assets",[]) if a.get("name")==name]
          if len(matches)!=1:
              raise SystemExit("Archive failed: the real MP4 release asset was not found")
          asset=matches[0]
          if int(asset.get("size",-1))!=mp4.stat().st_size:
              raise SystemExit("Archive failed: GitHub MP4 asset byte size mismatch")
          digest=asset.get("digest")
          if digest and digest != "sha256:"+sha:
              raise SystemExit("Archive failed: release asset SHA-256 mismatch")
          video_url=asset.get("browser_download_url","")
          release_url=info.get("html_url","")
          if not (video_url.startswith("https://github.com/") and release_url.startswith("https://github.com/")):
              raise SystemExit("Archive failed: GitHub did not return verified video URLs")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fp:
              fp.write(f"release_url={release_url}\nvideo_url={video_url}\nsha256={sha}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fp:
              fp.write(f"## Final video archived on GitHub\n\n")
              fp.write(f"- **[Download/view MP4 on GitHub]({video_url})**\n")
              fp.write(f"- [Release page]({release_url}) (draft — repository access required)\n")
              fp.write(f"- SHA-256: \`{sha}\`\n\n")
              fp.write("This confirms the MP4 asset exists; the draft Release is not publicly published.\n")
          (root/"github-video-links.json").write_text(
              json.dumps({"video_slug":slug,"video_url":video_url,
                          "release_url":release_url,"sha256":sha,
                          "release_tag":info["tag_name"],"draft":bool(info.get("draft",False))},indent=2)+"\n",
              encoding="utf-8"
          )
          print(f"Verified GitHub archive: {release_url}")
          PY
      - name: Preserve verified GitHub links as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-video-links-${{ inputs.video_slug }}
          path: ${{ runner.temp }}/github-video-links.json
          if-no-files-found: error
          retention-days: 90
