name: Update YouTube Metadata (HEM_CHUYEN_LA Private)

on:
  workflow_dispatch:
    inputs:
      items_json:
        description: 'JSON array of {video_id, metadata_path}'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HEM_CHUYEN_LA }}
      ITEMS_JSON: ${{ inputs.items_json }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/youtube-multi-requirements.txt
      - name: Update metadata on private videos
        shell: bash
        run: |
          printf '%s' "$ITEMS_JSON" > /tmp/items.json
          python scripts/youtube_update_metadata.py \
            --channel HEM_CHUYEN_LA \
            --items-json /tmp/items.json \
            --receipt youtube-update-metadata-receipt.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: youtube-update-metadata-receipt
          path: youtube-update-metadata-receipt.json
          if-no-files-found: ignore
          retention-days: 14
