name: One-time Silent Factory formatting repair
on:
  push:
    branches:
      - fix/silent-factory-longform-executor-20261105
    paths:
      - config/silent-factory/format-once-trigger.json
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message == 'chore(silent-factory): request one-time prettier format'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only new Silent Factory React files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/videos/silent-factory-longform/Reel.tsx src/videos/silent-factory-longform/index.ts
          npx prettier --check src/videos/silent-factory-longform/Reel.tsx src/videos/silent-factory-longform/index.ts
          git add src/videos/silent-factory-longform/Reel.tsx src/videos/silent-factory-longform/index.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(silent-factory): apply Prettier to new composition'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
