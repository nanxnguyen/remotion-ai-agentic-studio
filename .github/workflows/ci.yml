name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_render:
        description: Render the default MP4 after verification
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_runtime_orchestrator.py'
      - run: python3 -m unittest discover -s tests -p 'test_voice_performance_handoff.py'
      - run: python3 -m unittest discover -s tests -p 'test_agent_status_sync.py'
      - run: python3 .agents/skills/ray-pineline-worflow-agent/scripts/quick_validate.py
      - run: python3 scripts/sync_agents.py --check
      - run: python3 -m unittest scripts.test_sync_agents
      - run: python3 -m unittest scripts.test_voice_cache scripts.test_voice_performance
      - run: python3 -m unittest discover -s tests -p 'test_interactive_terminal.py'
      - run: python3 -m unittest discover -s tests -p 'test_terminal_model_effort.py'
      - run: python3 -m unittest discover -s tests -p 'test_terminal_ui.py'
      - run: npm run verify

  render:
    if: github.event_name == 'workflow_dispatch' && inputs.full_render
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4

  demo-smoke:
    name: Zero-key demo smoke renders
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg for GIF previews
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - name: Render MP4 and GIF previews
        run: node scripts/render-demo-showcase.mjs
      - name: Verify demo artifacts
        run: |
          for name in hello-world editorial-quote; do
            test -s "out/showcase/$name.mp4"
            test -s "out/showcase/$name.gif"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zero-key-demo-showcase
          path: out/showcase/
          retention-days: 14
