name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_render:
        description: Render the default MP4 after verification
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: npm run verify

  render:
    if: github.event_name == 'workflow_dispatch' && inputs.full_render
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4

  demo-smoke:
    name: Zero-key demo smoke renders
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render both self-contained sample compositions
        run: |
          npm run render -- --id HelloWorldReel --out out/hello-world.mp4
          npm run render -- --id EditorialQuoteReel --out out/editorial-quote.mp4
      - name: Verify rendered MP4s exist and are nonempty
        run: |
          test -s out/hello-world.mp4
          test -s out/editorial-quote.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: zero-key-demo-mp4s
          path: |
            out/hello-world.mp4
            out/editorial-quote.mp4
          retention-days: 14
