name: Archive video 12 full AV
on:
  push:
    branches: [feat/ray-emotional-stick-shorts]
    paths: ['.github/workflows/archive-video12.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ray-emotional-stick-shorts
          persist-credentials: true
      - name: Assemble complete video from original source assets
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p docs/video-12-cho-duoc-lua-chon/final
          curl --fail --location --retry 3 --max-time 120 --output /tmp/visual-piano.mp4 'https://resource2.heygen.ai/video/f93bc3c10ab54516b7a15388ce211763/original.mp4'
          curl --fail --location --retry 3 --max-time 120 --output /tmp/voice.wav 'https://resource2.heygen.ai/text_to_speech/89dd25c8c7cc43a7b96830a575b9e7df/046dacc3502347eea0c796f97399632e/id=1a4636ec-e372-4fab-845a-6c806071f646.wav'
          ffmpeg -hide_banner -loglevel error -y -i /tmp/visual-piano.mp4 -i /tmp/voice.wav \
            -filter_complex '[0:a]volume=0.95[m];[1:a]volume=1.5[v];[m][v]amix=inputs=2:duration=first:normalize=0[a]' \
            -map 0:v:0 -map '[a]' -c:v copy -c:a aac -b:a 192k -t 42.6 \
            docs/video-12-cho-duoc-lua-chon/final/video12-full-voice-piano.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type -of json docs/video-12-cho-duoc-lua-chon/final/video12-full-voice-piano.mp4
          sha256sum docs/video-12-cho-duoc-lua-chon/final/video12-full-voice-piano.mp4 > docs/video-12-cho-duoc-lua-chon/final/SHA256SUMS
          test "$(stat -c %s docs/video-12-cho-duoc-lua-chon/final/video12-full-voice-piano.mp4)" -gt 100000
      - name: Commit archived final MP4 to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/video-12-cho-duoc-lua-chon/final/
          git diff --cached --quiet || (git commit -m 'assets(video12): archive full voice and piano MP4' && git push)
