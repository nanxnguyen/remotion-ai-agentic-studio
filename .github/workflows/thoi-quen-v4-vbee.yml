name: V4 Small Habits - Real Emotional Vbee
on:
  push:
    branches: [feat/thoi-quen-nho-v4-cinematic-build]
    paths:
      - .github/workflows/thoi-quen-v4-vbee.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate authentic Vbee Ngoc Huyen emotional narration
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/thoi-quen-nho-v4/timeline.json \
            --out-dir public/audio/thoi-quen-nho-v4 \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 0.97 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: thoi-quen-v4-vbee-emotional
          path: public/audio/thoi-quen-nho-v4/
          retention-days: 14
          if-no-files-found: error
