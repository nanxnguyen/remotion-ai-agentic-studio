name: Temporary HEM_CHUYEN_LA duplicate audit (read-only)

on:
  push:
    branches:
      - "fix/restore-ray-pineline-shared-skill-alias-20261123"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HEM_CHUYEN_LA }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install read-only YouTube API client
        run: python -m pip install --disable-pip-version-check -r scripts/youtube-multi-requirements.txt
      - name: Audit all owner uploads without exposing titles or IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os, re, unicodedata
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          expected = "UC4zHyyv2YnYGv1xbyuZzteA"
          creds = Credentials(
              None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.readonly"],
          )
          creds.refresh(Request())
          yt = build("youtube", "v3", credentials=creds, cache_discovery=False)
          channels = yt.channels().list(part="id,snippet,contentDetails", mine=True).execute().get("items", [])
          if len(channels) != 1 or channels[0]["id"] != expected:
              raise SystemExit("BLOCKED: OAuth token does not resolve uniquely to HEM_CHUYEN_LA")
          playlist = channels[0]["contentDetails"]["relatedPlaylists"]["uploads"]
          ids, token, pages = [], None, 0
          while True:
              page = yt.playlistItems().list(part="contentDetails", playlistId=playlist, maxResults=50, pageToken=token).execute()
              ids.extend(x.get("contentDetails", {}).get("videoId") for x in page.get("items", []))
              token = page.get("nextPageToken")
              pages += 1
              if not token:
                  break
              if pages >= 100:
                  raise SystemExit("BLOCKED: upload playlist exceeded 100 pages; inventory incomplete")
          ids = [x for x in ids if x]
          videos = []
          for start in range(0, len(ids), 50):
              batch = yt.videos().list(part="snippet,status", id=",".join(ids[start:start+50]), maxResults=50).execute().get("items", [])
              videos.extend(batch)
          if len(videos) != len(ids):
              raise SystemExit(f"BLOCKED: playlist has {len(ids)} entries but API returned {len(videos)} video records")
          def norm(s):
              s = unicodedata.normalize("NFD", s or "")
              s = "".join(c for c in s if unicodedata.category(c) != "Mn")
              return re.sub(r"[^a-z0-9]+", " ", s.lower()).strip()
          groups = {
              "dong_trieu": ["dong trieu", "dong trao"],
              "chua_hoang": ["chua hoang"],
              "ho_phap": ["ho phap"],
              "thuy_than": ["thuy than"],
              "nguyen_du": ["nguyen du", "truyen ky man luc"],
          }
          counts = {"public": 0, "unlisted": 0, "private": 0, "other": 0}
          matches = 0
          matched_privacy = {"public": 0, "unlisted": 0, "private": 0, "other": 0}
          for v in videos:
              status = v.get("status", {}).get("privacyStatus", "other")
              counts[status if status in counts else "other"] += 1
              sn = v.get("snippet", {})
              haystack = norm(" ".join([sn.get("title", ""), sn.get("description", ""), *sn.get("tags", [])]))
              hit_groups = sum(any(term in haystack for term in terms) for terms in groups.values())
              if hit_groups >= 2:
                  matches += 1
                  matched_privacy[status if status in matched_privacy else "other"] += 1
          result = {
              "status": "DUPLICATE_RISK_FOUND" if matches else "NO_MATCH_FOUND_IN_OWNER_UPLOADS",
              "channel_id": expected,
              "total_uploads": len(videos),
              "privacy_counts": counts,
              "candidate": "Chuyen cai chua hoang o huyen Dong Trieu",
              "matching_upload_count": matches,
              "matching_privacy_counts": matched_privacy,
              "matching_rule": "at least two of Dong Trieu / Chua Hoang / Ho Phap / Thuy Than / Nguyen Du in title, description or tags",
              "titles_or_video_ids_exposed": False,
          }
          Path("out/hem-channel-duplicate-audit.json").write_text(json.dumps(result, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: hem-channel-duplicate-audit
          path: out/hem-channel-duplicate-audit.json
          retention-days: 1
