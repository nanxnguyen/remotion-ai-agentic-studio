name: Extract YouTube Shorts Frames

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Public YouTube video URL'
        required: true
        default: 'https://youtube.com/shorts/k9JB4RDDpsw'
        type: string
      mp4_url:
        description: 'Optional public HTTPS direct MP4 URL (bypasses YouTube rate limits)'
        required: false
        default: ''
        type: string
      fps:
        description: 'Frames per second (1-5)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '5']

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install standalone FFmpeg tools and yt-dlp
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ffmpeg-tools" --no-audit --no-fund \
            @ffmpeg-installer/linux-x64 @ffprobe-installer/linux-x64
          echo "$RUNNER_TEMP/ffmpeg-tools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ffmpeg-tools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
          python -m pip install --user --upgrade yt-dlp bgutil-ytdlp-pot-provider
          ~/.local/bin/yt-dlp --version

      - name: Set up Deno for YouTube JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start BgUtils PO token server
        run: |
          set -euo pipefail
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:4416/ >/dev/null 2>&1; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' bgutil-provider | grep -qx true; then
              docker logs bgutil-provider
              exit 1
            fi
            sleep 2
          done
          docker ps --filter name=bgutil-provider

      - name: Download video and metadata
        env:
          VIDEO_URL: ${{ inputs.video_url || 'https://youtube.com/shorts/k9JB4RDDpsw' }}
          MP4_URL: ${{ inputs.mp4_url || '' }}
        run: |
          set -euo pipefail
          mkdir -p output/frames
          if [[ -n "$MP4_URL" ]]; then
            case "$MP4_URL" in
              https://*) ;;
              *) echo "::error::Direct MP4 URL must use HTTPS"; exit 1 ;;
            esac
            curl --fail --location --retry 3 --max-time 180 \
              --output output/source.mp4 "$MP4_URL"
            VIDEO=output/source.mp4
          else
            case "$VIDEO_URL" in
              https://youtube.com/*|https://www.youtube.com/*|https://youtu.be/*|https://m.youtube.com/*) ;;
              *) echo "::error::Only HTTPS YouTube URLs are accepted"; exit 1 ;;
            esac
            ~/.local/bin/yt-dlp --verbose --js-runtimes deno -4 \
              --extractor-args 'youtube:player_client=mweb,tv,web_safari' --no-playlist --max-filesize 150M \
              --write-info-json --write-description \
              -f 'bv*+ba/b' --merge-output-format mp4 \
              -o 'output/source.%(ext)s' "$VIDEO_URL" || {
                echo "::error::YouTube blocked the hosted runner. Supply a public direct MP4 link via mp4_url or use a self-hosted runner."
                exit 1
              }
            VIDEO=$(find output -maxdepth 1 -type f \( -name 'source.mp4' -o -name 'source.webm' -o -name 'source.mkv' \) | head -1)
          fi
          test -n "$VIDEO" && test -s "$VIDEO"
          ffprobe -v error "$VIDEO" > /dev/null
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

      - name: Print BgUtils diagnostics
        if: failure()
        run: docker logs --tail 100 bgutil-provider || true

      - name: Extract frames and contact sheet
        env:
          FPS: ${{ inputs.fps || '1' }}
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" \
            -vf "fps=$FPS,scale=540:-2" -q:v 3 output/frames/frame_%04d.jpg
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" \
            -vf "fps=1/3,scale=270:-2,tile=4x5" -frames:v 1 output/contact-sheet.jpg || true
          ffprobe -v error -show_format -show_streams -of json "$VIDEO" > output/ffprobe.json
          printf '%s\n' "Video: ${{ inputs.video_url || 'https://youtube.com/shorts/k9JB4RDDpsw' }}" "Frames per second: $FPS" > output/README.txt
          rm -f "$VIDEO"
          test "$(find output/frames -name '*.jpg' | wc -l)" -gt 0

      - name: Upload frames and metadata
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-frames
          path: output/
          retention-days: 7
          if-no-files-found: error
