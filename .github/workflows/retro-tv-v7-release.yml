name: Publish Retro TV V7 checked MP4 on GitHub Releases
on:
  push:
    branches: [feat/retro-tv-v7-github-asset]
    paths:
      - 'release-assets/retro-tv-v7/*.mp4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release_mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm identical MP4 checksum and size
        shell: bash
        run: |
          set -euo pipefail
          file="release-assets/retro-tv-v7/Thanh_Cong_Tu_Thoi_Quen_Nho_Retro_TV_V7_Cinematic.mp4"
          test "$(stat -c '%s' "$file")" -eq 8771863
          echo "95925a895e9ff1dee066c0d5d63615514fef49380eba874d9bbda7bf1ab5f88c  $file" | sha256sum --check --status
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$file"
      - name: Publish verified GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="release-assets/retro-tv-v7/Thanh_Cong_Tu_Thoi_Quen_Nho_Retro_TV_V7_Cinematic.mp4"
          tag="retro-tv-v7-2026-10-24"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --title "Retro TV V7 — Thành Công Từ Thói Quen Nhỏ" --notes "25.33s, 1080x1920, Vietnamese Be Vietnam Pro captions and Vbee narration. Published after SHA-256 validation." --target "$GITHUB_SHA"
          fi
      - name: Verify asset in GitHub Release via API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="Thanh_Cong_Tu_Thoi_Quen_Nho_Retro_TV_V7_Cinematic.mp4"
          gh release view retro-tv-v7-2026-10-24 --json assets --jq ".assets[] | select(.name == \"$name\") | .size" | grep -x "8771863"
          gh release download retro-tv-v7-2026-10-24 --pattern "$name" --dir /tmp/verify-retro-v7
          echo "95925a895e9ff1dee066c0d5d63615514fef49380eba874d9bbda7bf1ab5f88c  /tmp/verify-retro-v7/$name" | sha256sum --check --status
