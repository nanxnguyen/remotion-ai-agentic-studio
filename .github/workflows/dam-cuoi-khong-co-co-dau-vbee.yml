name: Empty Bride Wedding Original Vbee Narration
on:
  push:
    branches: [feat/dam-cuoi-khong-co-co-dau-v1-final]
    paths:
      - .github/workflows/dam-cuoi-khong-co-co-dau-vbee.yml
      - docs/dam-cuoi-khong-co-co-dau/timeline.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthesize ten story lines with Vbee
        run: python3 scripts/gen-story-vbee-batch.py --timeline docs/dam-cuoi-khong-co-co-dau/timeline.json --out-dir public/audio/dam-cuoi-khong-co-co-dau --voice-code hn_male_phuthang_stor_24k-stl --speed 1.15 --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: wedding-no-bride-vbee-authentic
          path: public/audio/dam-cuoi-khong-co-co-dau/
          if-no-files-found: error
          retention-days: 20
