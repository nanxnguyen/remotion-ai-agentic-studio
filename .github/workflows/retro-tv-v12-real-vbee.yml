name: V12 Real Vbee Ngoc Huyen Revoice
on:
  push:
    branches: [feat/retro-tv-v12-vbee-ngoc-huyen-revoice]
    paths: [.github/workflows/retro-tv-v12-real-vbee.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/v12-ngoc-huyen' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthesize fresh genuine Vbee female Ngoc Huyen
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python scripts/gen-story-vbee-batch.py \
            --timeline docs/retro-tv-v12/narration.json \
            --out-dir public/audio/retro-tv-v12-revoice \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 1.12 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: v12-authentic-vbee-ngoc-huyen
          path: public/audio/retro-tv-v12-revoice/
          retention-days: 14
          if-no-files-found: error
