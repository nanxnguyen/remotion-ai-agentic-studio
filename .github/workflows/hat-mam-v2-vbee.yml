name: Hat Mam V2 - Emotional Vbee Voice
on:
  push:
    branches: [feat/hat-mam-short-cinematic-v2]
    paths:
      - .github/workflows/hat-mam-v2-vbee.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthesize heartfelt Vietnamese voice from real Vbee API
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/hat-mam-moi-ngay-v2/timeline.json \
            --out-dir public/audio/hat-mam-v2 \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 0.97 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: hat-mam-v2-emotional-vbee-voice
          path: public/audio/hat-mam-v2/
          if-no-files-found: error
          retention-days: 14
