name: One-shot Umbrella Olise PRIVATE (temporary)

on:
  push:
    branches:
      - feat/silent-daily-umbrella-private-test-20261104
    paths:
      - config/films/umbrella-one-shot-trigger.json

permissions:
  contents: read

concurrency:
  group: private-olise-umbrella-20261104
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'nanxnguyen/remotion-ai-agentic-studio'
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_OLISE_MAN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffprobe -version | head -n 1
      - name: Install Python uploader
        run: python -m pip install -r scripts/youtube-multi-requirements.txt
      - name: Verify channel routing tests
        run: python -m unittest discover -s tests -p test_youtube_multi_channel.py -v
      - name: One-time dry-run or owner-authorized Private upload
        shell: bash
        env:
          YOUTUBE_UPLOAD_PRIVATE_ENABLED: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          t=json.loads(Path('config/films/umbrella-one-shot-trigger.json').read_text())
          m=json.loads(Path('config/films/umbrella-20261104.json').read_text())
          assert t.get('mode') in ('dry_run','upload_private')
          assert t.get('channel')=='OLISE_MAN'
          assert t.get('metadata_path')=='config/films/umbrella-20261104.json'
          assert t.get('video_drive_id') and t.get('thumbnail_drive_id')
          assert m['privacy']=='private' and m.get('made_for_kids') is False
          if t['mode']=='upload_private':
              assert m.get('qa_approved') is True and m.get('creative_qa_override') is True
              assert m.get('creative_qa_passed') is False
          cmd=[sys.executable,'scripts/youtube_multi_channel.py','--channel','OLISE_MAN',
               '--video-drive-id',t['video_drive_id'],
               '--thumbnail-drive-id',t['thumbnail_drive_id'],
               '--metadata','config/films/umbrella-20261104.json',
               '--receipt','umbrella-private-receipt.json']
          if t['mode']=='upload_private':cmd.append('--execute')
          print('Run mode:',t['mode'],'target: Olise PRIVATE',flush=True)
          subprocess.run(cmd,check=True)
          PY
      - name: Store receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbrella-private-one-shot-receipt
          path: umbrella-private-receipt.json
          if-no-files-found: ignore
          retention-days: 30
