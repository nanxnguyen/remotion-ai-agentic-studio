name: Buc Anh Thu Tu - Vbee narration

on:
  workflow_dispatch:
    inputs:
      voice_code:
        description: Vbee Batch TTS voice code
        default: hn_male_phuthang_stor_24k-stl
        required: true
        type: string
  push:
    branches: [feat/buc-anh-thu-tu-video, feat/buc-anh-thu-tu-retention-cinematic-typography]
    paths:
      - .github/workflows/buc-anh-thu-tu-voice.yml
      - docs/buc-anh-thu-tu/timeline.json

permissions:
  contents: read

concurrency:
  group: buc-anh-thu-tu-vbee-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_VOICE_CODE: ${{ inputs.voice_code || vars.VBEE_VOICE_CODE || 'hn_male_phuthang_stor_24k-stl' }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Confirm Vbee Secrets are available
        shell: bash
        run: |
          if [[ -z "$VBEE_ACCESS_TOKEN" || -z "$VBEE_APP_ID" ]]; then
            echo "::error::Vbee token/App ID not configured in GitHub Secrets" 
            exit 1
          fi
      - name: Generate genuine Vbee narration
        shell: bash
        run: |
          python3 -m py_compile scripts/gen-story-vbee-batch.py
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/buc-anh-thu-tu/timeline.json \
            --out-dir public/audio/buc-anh-thu-tu \
            --voice-code "$VBEE_VOICE_CODE" \
            --speed 1.08 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - name: Store final voice tracks
        uses: actions/upload-artifact@v4
        with:
          name: buc-anh-thu-tu-vbee-voice
          path: public/audio/buc-anh-thu-tu/
          retention-days: 14
          if-no-files-found: error
