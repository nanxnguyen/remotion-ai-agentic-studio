name: Retro TV - forced word alignment for actual Vbee MP3
on:
  push:
    branches:
      - feat/retro-met-roi-final-20261025
    paths:
      - .github/workflows/retro-met-roi-align.yml
      - scripts/retro-met-roi-align.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  word-timestamps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original verified Vbee MP3 artifact
        uses: actions/download-artifact@v4
        with:
          name: retro-met-roi-genuine-vbee-ngoc-huyen
          run-id: 40172923863
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: voice
      - name: Install speech word aligner
        run: python3 -m pip install faster-whisper==1.2.1 soundfile==0.13.1
      - name: Align spoken words
        run: python3 scripts/retro-met-roi-align.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro-met-roi-vbee-word-timing
          path: build/retro-met-roi/alignment/
          retention-days: 14
          if-no-files-found: warn
