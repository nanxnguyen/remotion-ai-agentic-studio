name: Lighthouse V3 genuine Vbee batch
on:
  push:
    branches: [feat/hai-dang-v3-retention-cut]
    paths:
      - .github/workflows/ngon-hai-dang-v3-vbee.yml
      - docs/ngon-hai-dang/v3/timeline.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vbee:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original V3 narration
        run: python3 scripts/gen-story-vbee-batch.py --timeline docs/ngon-hai-dang/v3/timeline.json --out-dir public/audio/ngon-hai-dang-v3 --voice-code hn_male_phuthang_stor_24k-stl --speed 1.15 --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v3-authentic-vbee
          path: public/audio/ngon-hai-dang-v3/
          if-no-files-found: error
