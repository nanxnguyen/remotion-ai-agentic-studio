name: Suat Chieu Cuoi Cung - authentic Vbee narrator
on:
  push:
    branches: [feat/suat-chieu-cuoi-cung-film-v1]
    paths:
      - .github/workflows/suat-chieu-cuoi-cung-voice.yml
permissions:
  contents: read
jobs:
  vbee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authorized Vbee credentials presence
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
      - name: Synthesise real Vbee Anh Khoi lines
        run: |
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/suat-chieu-cuoi-cung/timeline.json \
            --out-dir public/audio/suat-chieu-cuoi-cung \
            --voice-code hn_male_phuthang_stor_24k-stl \
            --speed 1.12 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: suat-chieu-cuoi-cung-authentic-vbee
          path: public/audio/suat-chieu-cuoi-cung/
          retention-days: 14
          if-no-files-found: error
