name: Hem Chuyen La - Four Shorts Vbee Batch Voice

on:
  push:
    branches:
      - feat/hem-chuyen-la-four-shorts-20261101
    paths:
      - .github/workflows/hem-chuyen-la-four-vbee.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vbee-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://iehmucsshklgjmxqyggp.supabase.co/functions/v1/vbee-batch-callback' }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python and FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate credentials before chargeable requests
        run: |
          set -euo pipefail
          test -n "$VBEE_ACCESS_TOKEN" || { echo "::error::Missing Vbee access token secret"; exit 1; }
          test -n "$VBEE_APP_ID" || { echo "::error::Missing Vbee App ID secret"; exit 1; }
          case "$VBEE_WEBHOOK_URL" in https://*) ;; *) echo "::error::Vbee webhook must use HTTPS"; exit 1;; esac
          echo "Vbee credentials present; values are not logged."

      - name: Generate Vbee Batch narration - four stories
        run: |
          set -euo pipefail
          GEN=".claude/skills/ray-phim-ke-chuyen/scripts/generate_vbee_batch.py"
          VOICE="hn_male_phuthang_stor_24k-stl"
          python3 "$GEN" --manifest docs/hanh-khach-khong-buoc-ra/storyboard.json --out-dir public/audio/hanh-khach-khong-buoc-ra --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL"
          python3 "$GEN" --manifest docs/ban-tin-luc-0-gio-07/storyboard.json --out-dir public/audio/ban-tin-luc-0-gio-07 --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL"
          python3 "$GEN" --manifest docs/sap-hang-khong-co-trong-so/storyboard.json --out-dir public/audio/sap-hang-khong-co-trong-so --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL"
          python3 "$GEN" --manifest docs/cot-den-thu-tam/storyboard.json --out-dir public/audio/cot-den-thu-tam --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL"

      - name: Verify all 40 MP3 clips and measured timing
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          slugs = [
              "hanh-khach-khong-buoc-ra",
              "ban-tin-luc-0-gio-07",
              "sap-hang-khong-co-trong-so",
              "cot-den-thu-tam",
          ]
          total = 0
          for slug in slugs:
              root = Path("public/audio") / slug
              report = json.loads((root / "measured-timeline.json").read_text(encoding="utf-8"))
              assert len(report) == 10, (slug, len(report))
              for item in report:
                  audio = root / item["file"]
                  assert audio.is_file() and audio.stat().st_size > 1000
                  assert item["fits_scene"] is True, item
                  probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                       "-of", "default=noprint_wrappers=1:nokey=1", str(audio)],
                      capture_output=True, text=True, check=True
                  )
                  measured = float(probe.stdout.strip())
                  assert abs(measured - item["audio_seconds"]) < 0.08
                  total += 1
              print(f"{slug}: {len(report)}/10 genuine Vbee clips measured")
          assert total == 40
          print("VOICE PASS: 40/40 MP3 clips present and duration-checked.")
          PY

      - name: Upload private-review voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: hem-chuyen-la-four-vbee-voices
          path: |
            public/audio/hanh-khach-khong-buoc-ra/
            public/audio/ban-tin-luc-0-gio-07/
            public/audio/sap-hang-khong-co-trong-so/
            public/audio/cot-den-thu-tam/
          retention-days: 14
          if-no-files-found: error
