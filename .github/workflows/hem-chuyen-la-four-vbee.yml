# Preserve every generated MP3 even when a line needs timeline retiming.
name: Hem Chuyen La - Four Shorts Vbee Batch Voice

on:
  push:
    branches:
      - feat/hem-chuyen-la-four-shorts-20261101
    paths:
      - .github/workflows/hem-chuyen-la-four-vbee.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vbee-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://iehmucsshklgjmxqyggp.supabase.co/functions/v1/vbee-batch-callback' }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python and FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate credentials before chargeable requests
        run: |
          set -euo pipefail
          test -n "$VBEE_ACCESS_TOKEN" || { echo "::error::Missing Vbee access token secret"; exit 1; }
          test -n "$VBEE_APP_ID" || { echo "::error::Missing Vbee App ID secret"; exit 1; }
          case "$VBEE_WEBHOOK_URL" in https://*) ;; *) echo "::error::Vbee webhook must use HTTPS"; exit 1;; esac
          echo "Vbee credentials present; values are not logged."

      - name: Generate Vbee Batch narration - four stories
        run: |
          set +e
          GEN=".claude/skills/ray-phim-ke-chuyen/scripts/generate_vbee_batch.py"
          VOICE="hn_male_phuthang_stor_24k-stl"
          python3 "$GEN" --manifest docs/hanh-khach-khong-buoc-ra/storyboard.json --out-dir public/audio/hanh-khach-khong-buoc-ra --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL" || echo "::warning::Hành Khách: Vbee generated audio retained; inspect measured fit report."
          python3 "$GEN" --manifest docs/ban-tin-luc-0-gio-07/storyboard.json --out-dir public/audio/ban-tin-luc-0-gio-07 --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL" || echo "::warning::Bản Tin: Vbee generated audio retained; inspect measured fit report."
          python3 "$GEN" --manifest docs/sap-hang-khong-co-trong-so/storyboard.json --out-dir public/audio/sap-hang-khong-co-trong-so --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL" || echo "::warning::Sạp Hàng: Vbee generated audio retained; inspect measured fit report."
          python3 "$GEN" --manifest docs/cot-den-thu-tam/storyboard.json --out-dir public/audio/cot-den-thu-tam --voice-code "$VOICE" --speed 0.98 --webhook-url "$VBEE_WEBHOOK_URL" || echo "::warning::Cột Đèn: Vbee generated audio retained; inspect measured fit report."

      - name: Measure every generated clip and preserve overlong takes
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          slugs = [
              "hanh-khach-khong-buoc-ra",
              "ban-tin-luc-0-gio-07",
              "sap-hang-khong-co-trong-so",
              "cot-den-thu-tam",
          ]
          total = 0
          missing = []
          overlong = []
          for slug in slugs:
              manifest = json.loads((Path("docs") / slug / "storyboard.json").read_text(encoding="utf-8"))
              root = Path("public/audio") / slug
              root.mkdir(parents=True, exist_ok=True)
              report = []
              for scene in manifest:
                  i = int(scene["id"])
                  audio = root / f"s{i}.mp3"
                  if not audio.is_file() or audio.stat().st_size < 1000:
                      missing.append(f"{slug}/s{i}.mp3")
                      continue
                  probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                       "-of", "default=noprint_wrappers=1:nokey=1", str(audio)],
                      capture_output=True, text=True, check=True
                  )
                  seconds = float(probe.stdout.strip())
                  fits = seconds <= float(scene["duration_sec"]) - 0.1
                  item = {
                      "id": i, "file": audio.name, "text": scene["narration"],
                      "start_sec": float(scene["start_sec"]),
                      "duration_sec": float(scene["duration_sec"]),
                      "audio_seconds": round(seconds, 3),
                      "fits_scene": fits,
                      "voice_code": "hn_male_phuthang_stor_24k-stl",
                      "sha256": hashlib.sha256(audio.read_bytes()).hexdigest()
                  }
                  report.append(item)
                  total += 1
                  if not fits:
                      overlong.append(f"{slug}/s{i}.mp3 ({seconds:.2f}s > {scene['duration_sec']:.2f}s slot)")
              (root / "measured-timeline.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print(f"{slug}: {len(report)}/10 MP3 measured")
          print(f"Total valid MP3 files: {total}/40")
          if overlong:
              print("RETIME REQUIRED (do not trim audio):")
              print("\n".join(overlong))
          if missing:
              print("MISSING FILES:")
              print("\n".join(missing))
              raise SystemExit(1)
          if total != 40:
              raise SystemExit(f"Expected 40 clips, got {total}")
          print("VOICE ARTIFACT READY: all 40 genuine Vbee clips measured.")
          PY

      - name: Upload private-review voice artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hem-chuyen-la-four-vbee-voices
          path: |
            public/audio/hanh-khach-khong-buoc-ra/
            public/audio/ban-tin-luc-0-gio-07/
            public/audio/sap-hang-khong-co-trong-so/
            public/audio/cot-den-thu-tam/
          retention-days: 14
          if-no-files-found: warn
