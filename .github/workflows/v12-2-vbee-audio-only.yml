name: V12.2 Burning Desire - Real Vbee Ngoc Huyen
on:
  push:
    branches: [feat/v12-2-burning-desire-voice]
    paths: [.github/workflows/v12-2-vbee-audio-only.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/v122-revoice' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authentic Vbee Ngoc Huyen 48K new 4-act voice
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python scripts/gen-story-vbee-batch.py \
            --timeline docs/retro-tv-v12-2/narration.json \
            --out-dir public/audio/v12-2-burning-desire \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 1.22 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: v12-2-real-vbee-ngoc-huyen-audio-only
          path: public/audio/v12-2-burning-desire/
          retention-days: 3
          if-no-files-found: error
