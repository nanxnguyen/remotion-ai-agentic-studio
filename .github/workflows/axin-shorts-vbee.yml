name: Axin Shorts Vbee Voice (Ep 02-05)
on:
  workflow_dispatch:
    inputs:
      voice_code:
        description: 'Vbee voice code'
        required: true
        default: 'hn_male_phuthang_stor_24k-stl'
      speed:
        description: 'Narration speed (0.25 - 1.9)'
        required: true
        default: '1.0'

permissions:
  contents: read

jobs:
  vbee-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slug:
          - axin-short-02-khong-thanh-ke
          - axin-short-03-bo-vay-phu-nu
          - axin-short-04-dieu-thuyen-co-that-khong
          - axin-short-05-a-dau-gia-ngu
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FFmpeg / FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate Vbee voice for ${{ matrix.slug }}
        run: |
          set -eu
          mkdir -p "public/audio/${{ matrix.slug }}"
          python3 .claude/skills/ray-emotional-stick-shorts/scripts/vbee_tts.py \
            --text-file "docs/${{ matrix.slug }}/narration-vbee.txt" \
            --voice-code "${{ inputs.voice_code }}" \
            --speed "${{ inputs.speed }}" \
            --webhook-url "$VBEE_WEBHOOK_URL" \
            --output "public/audio/${{ matrix.slug }}/voiceover.mp3"
          ffprobe -v error -show_entries format=duration,size -of json "public/audio/${{ matrix.slug }}/voiceover.mp3"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.slug }}-vbee
          path: public/audio/${{ matrix.slug }}/voiceover.mp3
          retention-days: 14
          if-no-files-found: error
