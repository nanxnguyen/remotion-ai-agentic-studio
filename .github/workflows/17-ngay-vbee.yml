name: Emotional Stick Shorts 06 - Thanh Long voice
on:
  push:
    branches: [feat/17-ngay-gia-vo-di-lam-vbee]
    paths:
      - .github/workflows/17-ngay-vbee.yml
      - docs/17-ngay-gia-vo-di-lam/voice/narration.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Synthesize Vbee male Thanh Long
        env:
          VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
          VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN }}
          VBEE_WEBHOOK_URL: https://iehmucsshklgjmxqyggp.supabase.co/functions/v1/vbee-batch-callback
        run: |
          set -euo pipefail
          test -n "$VBEE_APP_ID" && test -n "$VBEE_ACCESS_TOKEN"
          mkdir -p output
          python3 .claude/skills/ray-emotional-stick-shorts/scripts/vbee_tts.py \
            --text-file docs/17-ngay-gia-vo-di-lam/voice/narration.txt \
            --voice-code hn_male_thanhlong_talk_48k-fhg \
            --speed 0.96 \
            --output output/17-ngay-vbee-thanhlong.mp3
          ffprobe -v error -show_entries stream=codec_name -show_entries format=duration -of json output/17-ngay-vbee-thanhlong.mp3 | tee output/ffprobe.json
          sha256sum output/17-ngay-vbee-thanhlong.mp3 > output/voice.sha256
          test "$(stat -c%s output/17-ngay-vbee-thanhlong.mp3)" -gt 10000
      - name: Keep authentic Vbee audio as artifact (no Git binary)
        uses: actions/upload-artifact@v4
        with:
          name: emotional-17-ngay-vbee-voice
          path: output/
          retention-days: 30
          if-no-files-found: error
