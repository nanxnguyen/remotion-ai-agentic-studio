name: V5 Original Style - Emotional Female Vbee
on:
  push:
    branches: [feat/thoi-quen-nho-v5-original-style]
    paths: [.github/workflows/v5-original-style-vbee.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/story-tts-webhook' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make authentic emotional Ngoc Huyen voice
        run: |
          test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
          python3 scripts/gen-story-vbee-batch.py \
            --timeline docs/thoi-quen-nho-v5/narration.json \
            --out-dir public/audio/thoi-quen-nho-v5 \
            --voice-code hn_female_ngochuyen_full_48k-fhg \
            --speed 0.96 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: thoi-quen-v5-vbee-real-narration
          path: public/audio/thoi-quen-nho-v5/
          if-no-files-found: error
          retention-days: 14
