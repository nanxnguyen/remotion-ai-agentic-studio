name: Room 707 V4 Genuine Vbee Voice
on:
  push:
    branches: [feat/room707-v4-film-20261031]
    paths:
      - .github/workflows/room707-v4-vbee.yml
      - docs/room707-v4/voice-lines.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/room707-callback' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check protected Vbee credentials
        run: |
          if [[ -z "$VBEE_ACCESS_TOKEN" || -z "$VBEE_APP_ID" ]]; then
            echo "::error::Missing protected VBEE access token or app ID"
            exit 1
          fi
      - name: Synthesize V4-only Vietnamese lines through Vbee Batch
        run: |
          python3 -m py_compile scripts/gen-707-vbee.py
          python3 scripts/gen-707-vbee.py \
            --timeline docs/room707-v4/voice-lines.json \
            --out-dir public/audio/room707-v4 \
            --voice-code hn_male_phuthang_stor_24k-stl \
            --speed 1.18 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - name: Archive measured V4 audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: room707-v4-genuine-vbee
          path: public/audio/room707-v4/
          retention-days: 14
          if-no-files-found: error
