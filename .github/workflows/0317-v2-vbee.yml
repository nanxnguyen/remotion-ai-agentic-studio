name: 0317 V2 genuine Vbee Batch (18 lines)
on:
  push:
    branches:
      - feat/0317-ca-khu-pho-cung-quay-dau-v2
    paths:
      - .github/workflows/0317-v2-vbee.yml
      - docs/0317-ca-khu-pho-cung-quay-dau-v2/voice-timeline.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN || secrets.VBEE_TOKEN || secrets.VBEE_API_KEY || secrets.VBEE_API_TOKEN }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID || secrets.VBEE_APPID || secrets.VBEE_APPLICATION_ID }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://example.com/0317-vbee-callback' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Require configured Vbee secrets
        run: test -n "$VBEE_ACCESS_TOKEN" && test -n "$VBEE_APP_ID"
      - name: Generate 18 authentic Vbee narration clips
        run: |
          python3 scripts/gen-laundry-vbee.py \
            --timeline docs/0317-ca-khu-pho-cung-quay-dau-v2/voice-timeline.json \
            --out-dir public/audio/0317-v2 \
            --voice-code hn_male_phuthang_stor_24k-stl \
            --speed 1.14 \
            --webhook-url "$VBEE_WEBHOOK_URL"
      - name: Verify MP3 files and SHA-256
        run: |
          python3 - <<'PY'
          import pathlib, json, hashlib
          p=pathlib.Path('public/audio/0317-v2')
          v=json.loads((p/'measured-timeline.json').read_text())
          assert len(v)==18,len(v)
          for x in v:
            a=p/x['audio_file']
            assert a.is_file() and a.stat().st_size>300
            assert hashlib.sha256(a.read_bytes()).hexdigest()==x['sha256']
            assert x['voice_code']=='hn_male_phuthang_stor_24k-stl'
            print(x['id'],x['audio_seconds'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 0317-v2-authentic-vbee-18-lines
          path: public/audio/0317-v2/
          retention-days: 14
          if-no-files-found: error
