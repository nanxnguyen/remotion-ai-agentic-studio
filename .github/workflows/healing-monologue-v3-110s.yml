name: Healing V3 — Real Footage and Vbee 110s Review
on:
  push:
    branches:
      - feat/healing-monologue-v3-110s-real-footage
    paths:
      - '.github/workflows/healing-monologue-v3-110s.yml'
      - 'docs/healing-monologue-v3-110s/story.json'
      - 'docs/healing-monologue-v3-110s/render.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: healing-v3-real-footage
  cancel-in-progress: false
jobs:
  review-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
      VBEE_ACCESS_TOKEN: ${{ secrets.VBEE_ACCESS_TOKEN }}
      VBEE_WEBHOOK_URL: https://iehmucsshklgjmxqyggp.supabase.co/functions/v1/vbee-batch-callback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/healing-monologue-v3-110s-real-footage
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl fonts-dejavu-core
          python -m pip install --disable-pip-version-check numpy pillow
      - name: Validate story and scripts
        run: |
          set -euo pipefail
          python -m py_compile 'docs/healing-monologue-v3-110s/render.py' docs/short-01-nho-phien-ban-duoc-yeu/voice/vbee_batch_tts.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/healing-monologue-v3-110s/story.json").read_text(encoding="utf8"))
          assert d["duration"]==110
          for key,count in (("shots",20),("storyBeats",10)):
              seq=d[key]
              assert len(seq)==count and seq[0]["start"]==0 and seq[-1]["end"]==110
              assert all(seq[i]["end"]==seq[i+1]["start"] for i in range(len(seq)-1))
          print("10 voice beats and 20 shots validated")
          PY
      - name: Assemble original piano
        run: |
          set -euo pipefail
          python 'docs/healing-monologue-v3-110s/render.py' score
      - name: Download/inspect real-life source footage and build 20-shot picture
        run: |
          set -euo pipefail
          python 'docs/healing-monologue-v3-110s/render.py' picture
      - name: Generate genuine Vbee Thanh Long, ten measured beats
        run: |
          set -euo pipefail
          test -n "$VBEE_APP_ID"
          test -n "$VBEE_ACCESS_TOKEN"
          test -n "$VBEE_WEBHOOK_URL"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/healing-monologue-v3-110s/story.json").read_text(encoding="utf8"))
          p=Path("/tmp/healing_v3")
          p.mkdir(exist_ok=True)
          for i,b in enumerate(d["storyBeats"]):
              (p/f"beat{i:02}.txt").write_text(b["text"],encoding="utf8")
          PY
          for i in 00 01 02 03 04 05 06 07 08 09; do
            python docs/short-01-nho-phien-ban-duoc-yeu/voice/vbee_batch_tts.py \
              --text-file "/tmp/healing_v3/beat$i.txt" \
              --voice-code hn_male_thanhlong_talk_48k-fhg \
              --speed 0.96 \
              --output "/tmp/healing_v3/voice$i.mp3" \
              --attempts 65
          done
      - name: Mix voice and emotion-adaptive piano, verify MP4
        run: |
          set -euo pipefail
          python 'docs/healing-monologue-v3-110s/render.py' mix
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,avg_frame_rate \
            -of json 'docs/healing-monologue-v3-110s/preview/healing-v3-real-footage-vbee-110s-review.mp4'
      - name: Save review cut on a feature branch, do NOT publish YouTube
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/healing-monologue-v3-110s/preview'
          git diff --cached --quiet || git commit -m "assets(healing-v3): reviewed-technical 110s real-footage Vbee proof"
          git fetch origin feat/healing-monologue-v3-110s-real-footage
          git rebase origin/feat/healing-monologue-v3-110s-real-footage
          git push origin HEAD:feat/healing-monologue-v3-110s-real-footage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healing-v3-110s-review
          path: 'docs/healing-monologue-v3-110s/preview'
          if-no-files-found: ignore
          retention-days: 14
