name: V5 Animation Gate 1 Proof

on:
  pull_request:
    paths:
      - "prototypes/khong-ai-vo-tay-v5-gate1/**"
      - ".github/workflows/v5-animation-gate1.yml"
  workflow_dispatch:

jobs:
  v5-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python render dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "numpy>=2,<3"
      - name: Install FFmpeg on the clean runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Run deterministic motion tests
        run: python -m unittest discover -s prototypes/khong-ai-vo-tay-v5-gate1 -p test_v5.py -v
      - name: Render 15-second original proof (native Full HD / 30fps)
        run: python prototypes/khong-ai-vo-tay-v5-gate1/render_gate1.py
      - name: Validate real MP4 streams and duration
        run: |
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 \
            prototypes/V5-GATE1-15s-1080p30.mp4 |
            awk '{if ($1 < 14.95 || $1 > 15.05) exit 1}'
          ffmpeg -hide_banner -loglevel error -i prototypes/V5-GATE1-15s-1080p30.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: v5-gate1-15s-1080p30
          path: |
            prototypes/V5-GATE1-15s-1080p30.mp4
            prototypes/V5-GATE1-storyboard-from-render.jpg
            prototypes/khong-ai-vo-tay-v5-gate1/manifest-v5-gate1.json
          retention-days: 90
