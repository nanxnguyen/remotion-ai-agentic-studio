name: One-time Umbrella Olise Private Release Test

on:
  push:
    branches:
      - feat/one-shot-umbrella-private-20261104
    paths:
      - config/films/umbrella-one-time-trigger.json

permissions:
  contents: read

concurrency:
  group: one-time-umbrella-olise-private
  cancel-in-progress: false

jobs:
  preflight-or-upload:
    if: github.repository == 'nanxnguyen/remotion-ai-agentic-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_OLISE_MAN }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      YOUTUBE_UPLOAD_PRIVATE_ENABLED: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg and FFprobe
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Install upload dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/youtube-multi-requirements.txt
      - name: Check upload routing tests
        run: python -m unittest discover -s tests -p 'test_youtube_multi_channel.py' -v
      - name: Verify fixed Olise target and run gated uploader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          cfg = json.loads(Path('config/films/umbrella-one-time-trigger.json').read_text())
          expected = {
            'channel': 'OLISE_MAN',
            'video_drive_id': '1mesjS1Ql-7eDuQ7sfTnrwIY_B0RUvHhq',
            'thumbnail_drive_id': '1JbNp4xUtVpwYpxM6r8OQMneFhcK6YzNK',
            'metadata_path': 'config/films/umbrella-that-chose-others-20261104.json'
          }
          if cfg.get('mode') not in {'dry_run', 'upload_private'} or any(cfg.get(k) != v for k,v in expected.items()):
              raise SystemExit('Blocked: unexpected mode, destination or Drive ID')
          meta = json.loads(Path(cfg['metadata_path']).read_text())
          if meta.get('privacy') != 'private' or meta.get('qa_approved') is not True:
              raise SystemExit('Blocked: missing owner-authorized private release evidence')
          if meta.get('creative_qa_override') is not True or meta.get('creative_qa_passed') is not False:
              raise SystemExit('Blocked: creative QA limitations must remain documented')
          cmd = [sys.executable, 'scripts/youtube_multi_channel.py',
                 '--channel', cfg['channel'],
                 '--video-drive-id', cfg['video_drive_id'],
                 '--thumbnail-drive-id', cfg['thumbnail_drive_id'],
                 '--metadata', cfg['metadata_path'],
                 '--receipt', 'youtube-private-receipt.json']
          print('One-time Umbrella release mode:', cfg['mode'], '(PRIVATE ONLY)', flush=True)
          if cfg['mode'] == 'upload_private':
              cmd.append('--execute')
          subprocess.run(cmd, check=True)
          PY
      - name: Save preflight / upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbrella-olise-private-receipt
          path: youtube-private-receipt.json
          if-no-files-found: ignore
          retention-days: 30
