name: Bug report
description: Report a reproducible problem with the studio or video pipeline
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact CLI commands and the composition ID.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, Remotion version, and relevant log excerpts. Never share secrets.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I ran npm run verify or explained why it could not run.
