<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Theo dõi agent, nhánh song song, review gate và đầu ra của pipeline sản xuất video AI.">
<title>Agent Workflow Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060b;--panel:#0d121c;--text:#dce3ee;--muted:#7c8aa0;--faint:#55657c;--teal:#2dd4bf;--teal-soft:#5eead4;--cyan:#38bdf8;--purple:#a78bfa;--green:#4ade80;--amber:#fbbf24;--orange:#fb923c;--red:#f87171;--mono:"JetBrains Mono",monospace;--sans:"Sora",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{min-width:320px;background:var(--bg)}body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--text)}::selection{background:var(--teal);color:#04141b}button,textarea{font:inherit}button:focus-visible,textarea:focus-visible,video:focus-visible,[tabindex]:focus-visible{outline:2px solid #99f6e4;outline-offset:3px}
.monitor-root{position:relative;min-height:100vh;background:#04060b;overflow:hidden}
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.blob{position:absolute;border-radius:50%;filter:blur(10px)}.blob-a{top:-10%;left:5%;width:460px;height:460px;background:radial-gradient(circle,rgba(45,212,191,.14),transparent 70%);animation:floatBlobA 14s ease-in-out infinite}.blob-b{right:8%;bottom:-15%;width:520px;height:520px;background:radial-gradient(circle,rgba(56,189,248,.13),transparent 70%);animation:floatBlobB 16s ease-in-out infinite}.floor-grid{position:absolute;left:50%;bottom:-25%;width:220%;height:60%;transform:translateX(-50%) perspective(600px) rotateX(58deg);background-image:linear-gradient(rgba(94,234,212,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.08) 1px,transparent 1px);background-size:56px 56px;animation:gridDrift 9s linear infinite;opacity:.5}
.reference-shell{position:relative;z-index:1;width:min(1840px,calc(100% - 48px));margin:0 auto;padding:30px 0 46px;display:grid;grid-template-columns:288px minmax(0,1fr);gap:22px;align-items:start}
.project-rail{position:sticky;top:24px;max-height:calc(100vh - 48px);display:flex;overflow:auto;flex-direction:column;gap:14px;padding:18px 14px;border:1px solid rgba(148,163,184,.12);border-radius:18px;background:rgba(10,14,24,.72);backdrop-filter:blur(14px)}.rail-label{padding:0 4px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.rail-title{padding:0 4px;color:#cbd5e1;font-size:13px;font-weight:600}.rail-title span{color:var(--faint);font-weight:500}.project-list{display:flex;flex-direction:column;gap:9px}.project-card{width:100%;padding:12px 13px;border:1px solid rgba(148,163,184,.1);border-radius:12px;background:rgba(255,255,255,.015);color:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s}.project-card:hover{border-color:rgba(94,234,212,.45)}.project-card[aria-current=true]{border-color:var(--teal);background:rgba(45,212,191,.08);box-shadow:0 0 18px rgba(45,212,191,.18)}.project-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.project-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--muted)}.project-dot.in_progress{background:var(--amber);animation:pulseAmber 1.6s ease-in-out infinite}.project-dot.done{background:var(--teal)}.project-dot.gate{background:var(--purple)}.project-dot.failed,.project-dot.blocked{background:var(--red)}.project-name{min-width:0;flex:1;overflow:hidden;color:#e2e8f0;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.project-badge{padding:2px 7px;border:1px solid rgba(239,68,68,.3);border-radius:6px;background:rgba(239,68,68,.12);color:#fca5a5;font-size:10px;font-weight:600;white-space:nowrap}.project-badge.run{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.1);color:var(--amber)}.project-subtitle{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;color:var(--muted);font:10.5px var(--mono)}.project-progress{display:block;height:4px;overflow:hidden;border-radius:3px;background:rgba(148,163,184,.14)}.project-progress span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--project-color),var(--teal))}
.content-column{min-width:0;display:flex;flex-direction:column;gap:20px}.monitor-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;display:flex;flex:none;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(145deg,#0ea5a0,#0369a1);box-shadow:0 0 20px rgba(45,212,191,.4)}.brand h1{margin:0;color:#f1f5f9;font-size:17px;line-height:1.2}.brand p{margin:2px 0 0;color:var(--muted);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}.live{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid rgba(45,212,191,.25);border-radius:999px;background:rgba(45,212,191,.08);color:var(--teal-soft);font-size:12px;font-weight:600}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulseLive 2s ease-in-out infinite}.live.off{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:var(--red)}.live.off .live-dot{background:var(--red)}
.workspace{min-width:0}.workspace-inner{display:flex;flex-direction:column;gap:20px}.loading{min-height:480px;display:grid;place-items:center;color:var(--muted)}.connection-banner{display:none;padding:12px 15px;border:1px solid rgba(248,113,113,.35);border-radius:12px;background:rgba(248,113,113,.08);color:#fca5a5;font-size:12px}.connection-banner.show{display:block}
.card{border:1px solid rgba(148,163,184,.12);border-radius:18px;background:rgba(13,18,28,.78)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;flex-wrap:wrap}.section-head h2{margin:0;color:#f1f5f9;font-size:15px}.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.counter{padding:4px 12px;border:1px solid rgba(94,234,212,.2);border-radius:999px;background:rgba(94,234,212,.08);color:var(--teal-soft);font:11.5px var(--mono);white-space:nowrap}.empty{padding:26px;color:var(--muted);font-size:12px;text-align:center}
/* Orchestration: director hub + phase pods with every agent of the roster */
.orchestration-card{padding:24px 22px 20px;background:linear-gradient(155deg,rgba(17,24,39,.72),rgba(10,15,25,.82))}.orchestration-title{text-align:center;margin-bottom:18px}.orchestration-title strong{display:block;color:var(--teal-soft);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.orchestration-title span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.orchestration-graph{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);gap:16px 40px;align-items:center}.orchestration-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.orchestration-lines path{fill:none;stroke:rgba(94,234,212,.22);stroke-width:1.4;stroke-dasharray:5 6;animation:beamFlow 2.4s linear infinite}.orchestration-lines path.active{stroke:var(--amber);stroke-width:2;opacity:.95;animation-duration:.9s;filter:drop-shadow(0 0 4px rgba(251,191,36,.7))}.pod-col{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}.hub-col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.hub{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(45,212,191,.5);border-radius:50%;background:radial-gradient(circle at 35% 30%,#1a2b36,#07131a);box-shadow:0 0 26px 4px rgba(45,212,191,.25)}.hub.running{animation:hubPulse 2.2s ease-in-out infinite}.hub-name{color:#e2e8f0;font:600 12px var(--mono)}.hub-role{max-width:190px;color:var(--muted);font-size:10.5px;text-align:center}.hub-state{padding:2px 9px;border-radius:999px;font:600 10px var(--mono)}.hub-state.running{background:rgba(251,191,36,.12);color:var(--amber)}.hub-state.idle{background:rgba(148,163,184,.1);color:var(--muted)}
.pod{padding:11px 12px 12px;border:1px solid rgba(148,163,184,.13);border-radius:14px;background:rgba(8,12,20,.82);transition:border-color .3s,box-shadow .3s}.pod.active{border-color:rgba(251,191,36,.55);box-shadow:0 0 22px rgba(251,191,36,.16)}.pod.done{border-color:rgba(74,222,128,.25)}.pod-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.pod-title{color:#cbd5e1;font-size:11.5px;font-weight:700}.pod-gates{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.lane{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lane+.lane{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(148,163,184,.1)}.lane-tag{min-width:52px;color:var(--faint);font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.06em}.lane-arrow{color:var(--faint);font-size:11px}
.agent-chip{--c:#64748b;position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 6px;border:1px solid rgba(148,163,184,.16);border-radius:9px;background:rgba(15,21,32,.9);color:#94a3b8;font:500 10.5px var(--mono);white-space:nowrap;cursor:default;transition:all .3s}.agent-chip .av{width:16px;height:16px;display:flex;flex:none;align-items:center;justify-content:center;border:1px solid var(--c);border-radius:5px;color:var(--c);font:700 8.5px var(--sans);opacity:.55}.agent-chip.reviewer .av{border-radius:50%}.agent-chip .st{font-size:9.5px}.agent-chip.done{color:#cbd5e1}.agent-chip.done .av{opacity:.9}.agent-chip.done .st{color:var(--green)}.agent-chip.failed{border-color:rgba(248,113,113,.5);color:#fca5a5}.agent-chip.failed .st{color:var(--red)}
.agent-chip.running{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#0b1119);color:#f8fafc;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 0 18px color-mix(in srgb,var(--c) 55%,transparent);animation:agentGlow 1.6s ease-in-out infinite}.agent-chip.running .av{opacity:1;background:var(--c);color:#04141b}.agent-chip.running .st{color:var(--amber)}.agent-chip.inferred.running{border-style:dashed}.agent-count{padding:0 4px;border-radius:4px;background:rgba(255,255,255,.08);font-size:9px}
.orch-legend{display:flex;justify-content:center;gap:16px;margin-top:16px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}.orch-legend span{display:flex;align-items:center;gap:6px}.orch-legend i{width:9px;height:9px;border-radius:3px;border:1px solid currentColor}.orch-legend .on i{background:var(--amber);color:var(--amber);box-shadow:0 0 8px var(--amber)}
/* Overview + output */
.overview-card{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:26px 30px;border:1px solid rgba(148,163,184,.14);border-radius:18px;background:linear-gradient(155deg,rgba(17,24,39,.85),rgba(10,15,25,.9));flex-wrap:wrap}.overview-copy{min-width:260px;flex:1}.eyebrow{margin-bottom:10px;color:var(--teal-soft);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.overview-name{margin-bottom:12px;color:#f8fafc;font:600 26px var(--mono);overflow-wrap:anywhere}.overview-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:#94a3b8;font-size:12.5px;flex-wrap:wrap}.overview-meta strong{color:var(--teal-soft)}.overview-meta code{font-family:var(--mono)}.flow-badge{padding:2px 8px;border:1px solid rgba(167,139,250,.35);border-radius:6px;color:var(--purple);font:600 10.5px var(--mono)}.next-step{display:flex;align-items:center;gap:10px}.next-icon{width:30px;height:30px;box-sizing:content-box;display:flex;align-items:center;justify-content:center;border:1px solid rgba(94,234,212,.3);border-radius:9px;background:rgba(94,234,212,.1)}.next-step small,.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.next-step b{display:block;color:#e2e8f0;font-size:14px}.progress-ring{--progress:0%;position:relative;width:126px;height:126px;display:flex;flex:none;align-items:center;justify-content:center;border-radius:50%;background:conic-gradient(var(--teal) var(--progress),rgba(255,255,255,.07) 0);box-shadow:0 0 28px rgba(45,212,191,.3)}.progress-ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0a0e17}.ring-copy{position:relative;text-align:center}.ring-copy b{display:block;color:#f8fafc;font:700 24px var(--mono)}.ring-copy span{color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.overview-stats{display:flex;flex-direction:column;gap:10px;flex:none}.stat{text-align:right}.stat b{display:block;color:#e2e8f0;font:600 16px var(--mono)}.stat.current b{max-width:220px;color:var(--teal);font:600 13px var(--sans)}
.output-card{display:flex;gap:22px;padding:22px 24px;border:1px solid rgba(45,212,191,.25);border-radius:18px;background:linear-gradient(155deg,rgba(17,24,39,.85),rgba(10,15,25,.9));flex-wrap:wrap}.video-frame{position:relative;width:160px;aspect-ratio:9/16;flex:none;overflow:hidden;border:1px solid rgba(45,212,191,.3);border-radius:14px;background:#03060a}.video-frame video{width:100%;height:100%;object-fit:cover}.output-copy{min-width:220px;display:flex;flex:1;flex-direction:column;justify-content:center;gap:10px}.output-title{color:#f8fafc;font:600 18px var(--mono);overflow-wrap:anywhere}.output-meta{display:flex;gap:14px;color:#94a3b8;font-size:12px;flex-wrap:wrap}.output-meta .pass{color:var(--green)}.output-meta .warn{color:var(--amber)}.output-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.action{display:flex;align-items:center;gap:7px;height:36px;padding:0 16px;border:1px solid rgba(148,163,184,.25);border-radius:9px;background:rgba(148,163,184,.1);color:#cbd5e1;font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer}.action.primary{border:0;background:var(--teal);color:#04141b;font-weight:700}.output-locked{display:flex;align-items:center;gap:14px;padding:20px 24px;border:1px dashed rgba(148,163,184,.22);border-radius:18px;background:rgba(13,18,28,.6);color:var(--muted);font-size:13px}
/* Pipeline DAG with fork / join */
.pipeline-card{padding:22px 26px 20px}.pipeline-scroll{display:flex;align-items:center;overflow-x:auto;padding:34px 8px 22px;scrollbar-width:thin;scrollbar-color:rgba(94,234,212,.42) rgba(148,163,184,.08)}.pipeline-scroll::-webkit-scrollbar{height:6px}.pipeline-scroll::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(94,234,212,.42)}
.stage-node{--stage-color:#64748b;position:relative;width:112px;display:flex;flex:none;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:transparent;color:inherit;cursor:pointer;transition:transform .2s}.stage-node:hover{transform:translateY(-3px)}.stage-robot{position:relative;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--stage-color) 40%,transparent);border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--stage-color) 20%,transparent),#0b1119 72%);box-shadow:0 0 14px color-mix(in srgb,var(--stage-color) 16%,transparent)}.stage-node.in_progress .stage-robot{border:2px solid var(--amber);animation:stagePulse 1.8s ease-in-out infinite}.stage-node[aria-pressed=true] .stage-robot{border:2px solid var(--teal);box-shadow:0 0 26px rgba(45,212,191,.5)}.stage-node.gate-warn .stage-robot{border-style:dashed}.stage-node.virtual .stage-robot{border-radius:18px}.stage-number{position:absolute;z-index:2;top:-6px;left:-8px;min-width:22px;height:20px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(148,163,184,.35);border-radius:999px;background:#0b1119;color:#94a3b8;font:700 9.5px var(--mono)}.stage-name{min-height:30px;color:#e2e8f0;font-size:11.5px;font-weight:700;line-height:1.3;text-align:center}.stage-status{display:flex;align-items:center;gap:5px;color:var(--stage-color);font-size:10px;font-weight:600}.stage-status i{width:6px;height:6px;border-radius:50%;background:currentColor}.stage-agents{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:112px}.stage-agents .agent-chip{padding:2px 6px 2px 3px;font-size:9px}.stage-agents .agent-chip .av{width:12px;height:12px;font-size:7px}
.stage-gate{padding:2px 7px;border:1px solid rgba(148,163,184,.25);border-radius:999px;background:rgba(148,163,184,.08);color:var(--muted);font:600 9.5px var(--mono);white-space:nowrap}.stage-gate.pass{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.1);color:var(--green)}.stage-gate.override{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1);color:var(--amber)}.stage-gate.revise{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1);color:#fca5a5}.stage-gate.stale{border-color:rgba(251,146,60,.5);background:rgba(251,146,60,.1);color:var(--orange)}.stage-gate.warn{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1);color:var(--amber)}
.review-node .stage-robot{border-radius:16px;border-style:solid;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--stage-color) 22%,transparent),#0d0b19 72%)}.review-node .stage-name{color:#d8ccff;font:600 10.5px var(--mono)}.review-node.waiting .stage-robot{border:2px dashed var(--purple)}.review-node.revise .stage-robot,.review-node.stale .stage-robot{border-width:2px}.stage-connector.review{width:22px;background:repeating-linear-gradient(90deg,rgba(167,139,250,.6) 0 4px,transparent 4px 7px)}.stage-connector.review.done{background:repeating-linear-gradient(90deg,rgba(167,139,250,.95) 0 4px,transparent 4px 7px)}.stage-connector.review.done:after{background:var(--purple);box-shadow:0 0 8px 2px rgba(167,139,250,.6)}
.stage-connector{position:relative;width:34px;height:2px;flex:none;align-self:center;margin-top:-58px;background:linear-gradient(90deg,rgba(148,163,184,.3),rgba(148,163,184,.1))}.stage-connector.done{background:rgba(45,212,191,.45)}.stage-connector.done:after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px 2px rgba(45,212,191,.6);animation:flowDot 2.6s linear infinite}
.pipeline-fork{position:relative;display:flex;flex:none;flex-direction:column;gap:14px;padding:6px 30px;border-radius:16px;background:rgba(167,139,250,.035)}.pipeline-fork:before,.pipeline-fork:after{content:"";position:absolute;top:var(--fork-top,58px);bottom:var(--fork-bottom,58px);width:2px;background:rgba(167,139,250,.45)}.pipeline-fork:before{left:0}.pipeline-fork:after{right:0}.fork-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:var(--purple);font:700 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.pipeline-lane{position:relative;display:flex;align-items:center;gap:0;padding:8px 10px 6px;border:1px solid rgba(148,163,184,.1);border-radius:14px;background:rgba(8,12,20,.6)}.pipeline-lane.active{border-color:rgba(251,191,36,.4);box-shadow:0 0 18px rgba(251,191,36,.1)}.pipeline-lane:before,.pipeline-lane:after{content:"";position:absolute;top:39px;width:30px;height:2px;background:rgba(167,139,250,.45)}.pipeline-lane:before{left:-31px}.pipeline-lane:after{right:-31px}.lane-name{position:absolute;top:-8px;left:12px;padding:0 6px;border-radius:5px;background:#0d121c;color:var(--purple);font:700 9.5px var(--mono);letter-spacing:.06em}.pipeline-lane .stage-connector{width:24px}
.legend{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.legend i{width:7px;height:7px;border-radius:50%;background:currentColor}.stage-note{margin-top:16px;padding:14px 16px;border:1px solid rgba(94,234,212,.2);border-radius:12px;background:rgba(94,234,212,.06);color:#cbd5e1;font:12px/1.6 var(--mono);overflow-wrap:anywhere}.stage-note b{color:var(--teal-soft)}
/* Reviews + log */
.review-log-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}.review-card{padding:20px 22px}.review-grid{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(110px,1fr) 78px 52px minmax(90px,1fr);gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(148,163,184,.06)}.review-grid.header{padding-top:0;color:var(--faint);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}.review-grid.branch strong:before{content:"↳ ";color:var(--purple)}.review-grid strong{color:#e2e8f0;font-size:12.5px}.review-grid strong small{display:block;color:var(--faint);font:500 10px var(--sans)}.review-state{display:flex;align-items:center;gap:6px;color:var(--review-color);font-size:12px;font-weight:600}.review-state i{width:6px;height:6px;flex:none;border-radius:50%;background:currentColor}.review-value{color:#94a3b8;font:12px var(--mono);white-space:nowrap}.review-who{overflow:hidden;color:var(--muted);font:10.5px var(--mono);text-overflow:ellipsis;white-space:nowrap}.review-note{grid-column:1/-1;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.review-note code{color:var(--faint);font:10.5px var(--mono)}
.log-card{position:relative;overflow:hidden;padding:18px 20px 14px;background:#070a10;font-family:var(--mono)}.log-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.log-head strong{color:#f1f5f9;font:700 13px var(--sans)}.log-filter{display:flex;gap:4px}.log-filter button{padding:2px 8px;border:1px solid rgba(148,163,184,.2);border-radius:999px;background:transparent;color:var(--muted);font:10px var(--mono);cursor:pointer}.log-filter button[aria-pressed=true]{border-color:var(--teal);color:var(--teal-soft)}.log-lines{max-height:430px;display:flex;overflow:auto;flex-direction:column;gap:9px;padding-right:4px;scrollbar-width:thin}.log-line{padding-left:10px;border-left:2px solid var(--log-color);font-size:11px;line-height:1.5}.log-meta{color:var(--faint)}.log-agent{color:var(--log-color)}.log-tag{color:var(--muted)}.log-msg{color:#cbd5e1;overflow-wrap:anywhere}
.gate-card{padding:20px 22px;border-color:rgba(167,139,250,.3)}.gate-body{display:grid;grid-template-columns:1fr minmax(260px,.8fr);gap:20px}.gate-summary{color:#94a3b8;font-size:12px}.gate-files{display:grid;gap:4px;margin-top:10px}.gate-files code{color:var(--muted);font:10px var(--mono)}.gate-card label{display:block;margin-bottom:7px;font-size:12px;font-weight:600}.gate-card textarea{width:100%;min-height:78px;resize:none;padding:10px 12px;border:1px solid rgba(148,163,184,.22);border-radius:9px;background:#070a10;color:var(--text)}.gate-actions{display:flex;gap:9px;margin-top:10px}.gate-actions button{min-height:38px;padding:0 14px;border-radius:9px;cursor:pointer;font-weight:700}.approve{border:1px solid var(--green);background:var(--green);color:#04140c}.revise{border:1px solid rgba(248,113,113,.45);background:rgba(248,113,113,.08);color:#fca5a5}
@keyframes gridDrift{to{background-position:0 60px,60px 0}}@keyframes floatBlobA{50%{transform:translate(30px,-40px)}}@keyframes floatBlobB{50%{transform:translate(-40px,30px)}}@keyframes flowDot{0%{left:0;opacity:0}8%,92%{opacity:1}100%{left:100%;opacity:0}}@keyframes pulseLive{50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}@keyframes pulseAmber{50%{box-shadow:0 0 0 6px rgba(251,191,36,0)}}@keyframes hubPulse{0%,100%{box-shadow:0 0 30px 6px rgba(45,212,191,.35),inset 0 0 20px rgba(45,212,191,.25)}50%{box-shadow:0 0 54px 16px rgba(45,212,191,.5),inset 0 0 26px rgba(45,212,191,.4)}}@keyframes beamFlow{to{stroke-dashoffset:-44}}@keyframes agentGlow{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 0 30px color-mix(in srgb,var(--c) 80%,transparent)}}@keyframes stagePulse{50%{box-shadow:0 0 26px rgba(251,191,36,.55)}}
@media(max-width:1180px){.orchestration-graph{grid-template-columns:1fr;gap:12px}.hub-col{order:-1}.orchestration-lines{display:none}.review-log-grid{grid-template-columns:1fr}}
@media(max-width:900px){.reference-shell{grid-template-columns:1fr}.project-rail{position:relative;top:0;max-height:none}.project-list{overflow-x:auto;overflow-y:hidden;flex-direction:row;padding-bottom:4px;scrollbar-width:none}.project-card{min-width:230px}}
@media(max-width:560px){.reference-shell{width:calc(100% - 32px);padding-top:16px}.brand p,.live-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.overview-card{padding:22px}.overview-name{font-size:20px}.overview-stats{width:100%;flex-direction:row;justify-content:space-between}.stat{text-align:left}.output-card{padding:16px}.video-frame{width:120px}.pipeline-card,.review-card,.log-card,.orchestration-card{padding-left:14px;padding-right:14px}.gate-body{grid-template-columns:1fr}.review-grid{grid-template-columns:1fr auto auto;gap:4px 8px}.review-grid .review-who,.review-grid .rounds{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="monitor-root">
  <div class="backdrop" aria-hidden="true"><div class="blob blob-a"></div><div class="blob blob-b"></div><div class="floor-grid"></div></div>
  <div class="reference-shell">
    <nav class="project-rail floating-rail" id="list" aria-label="Danh sách video"></nav>
    <div class="content-column">
      <header class="monitor-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.4" fill="#e6fffb"/><circle cx="18" cy="6" r="2.4" fill="#e6fffb"/><circle cx="12" cy="18" r="2.4" fill="#e6fffb"/><path d="M6 6 12 18M18 6 12 18M6 6h12" stroke="#e6fffb"/></svg></span><div><h1>Agent Workflow Monitor</h1><p>AI Video Production Control</p></div></div><span class="live" id="live" role="status" aria-live="polite"><i class="live-dot"></i><span class="live-label">Đang kết nối trực tiếp</span></span></header>
      <main class="workspace" id="main"><div class="loading">Đang đồng bộ pipeline…</div></main>
    </div>
  </div>
</div>
<template id="result-video-template"><video id="result-video" controls playsinline preload="metadata" aria-label="Video thành phẩm"></video></template>
<script>
const LABEL={done:'Hoàn tất',in_progress:'Đang chạy',pending:'Đang chờ',blocked:'Bị chặn',failed:'Có lỗi',skipped:'Không áp dụng',waiting:'Chờ review',revise:'Chưa đạt · sửa',stale:'Hết hiệu lực'};
const COLOR={done:'#4ade80',in_progress:'#fbbf24',pending:'#64748b',blocked:'#f87171',failed:'#f87171',skipped:'#334155',waiting:'#a78bfa',revise:'#f87171',stale:'#fb923c'};
const AGENT_COLOR={red:'#f87171',orange:'#fb923c',yellow:'#facc15',green:'#4ade80',teal:'#2dd4bf',cyan:'#22d3ee',blue:'#60a5fa',purple:'#a78bfa',pink:'#f472b6',gray:'#94a3b8'};
const REVIEW_LABEL={A:['A · Script','script-reviewer'],content:['Content branch','content-reviewer'],audio:['Audio branch','audio-reviewer'],D:['D · Design','design-reviewer'],E:['E · Integration','integration-reviewer'],B:['B · Task plan','task-reviewer'],C:['C · Final barrier','video-reviewer']};
const REVIEW_ORDER=['A','content','audio','D','E','B','C'];
const LANES=[['content','3a Content'],['audio','3b Audio'],['design','3c Design']];
// Orchestration pods: phase groups around the director hub (left column, right column).
const PODS=[[{title:'0–1 · Intake & Research',nodes:['intake','research']},{title:'2 · Brief & Script',nodes:['brief','script']},{title:'3 · Ba nhánh song song',nodes:['content','voice','audio','design'],lanes:true}],[{title:'4–5 · Join & Integration',nodes:['join']},{title:'6 · Task plan',nodes:['tasks']},{title:'7–8 · Build & QA',nodes:['build','qa']},{title:'9 · Render & final barrier',nodes:['render']}]];
let meta=null,data=[],cur=null,sel=null,last='',busy=false,logFilter='all';
const parts={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('vi-VN',{hour12:false}):'—';
const short=t=>t?new Date(t).toLocaleTimeString('vi-VN',{hour12:false}):'';
const bot=(color,size=36)=>`<svg width="${size}" height="${size}" viewBox="0 0 36 36" fill="none"><line x1="18" y1="10" x2="18" y2="5" stroke="${color}" stroke-width="1.4"/><circle cx="18" cy="4" r="1.7" fill="${color}"/><rect x="6" y="10" width="24" height="19" rx="9" fill="#0e1520" stroke="${color}" stroke-width="1.5"/><rect x="9.5" y="14" width="17" height="9.5" rx="4.75" fill="#070a10" stroke="${color}" opacity=".7"/><circle cx="14.2" cy="18.6" r="2.3" fill="${color}"/><circle cx="21.8" cy="18.6" r="2.3" fill="${color}"/></svg>`;
const flowNode=id=>meta.flow.find(n=>n.id===id);
const stageOf=(v,id)=>v.stages.find(s=>s.id===id);

// ---- status derivation (single place, used by every panel) ----
function reviewChip(v,g){const r=v.reviews?.[g];if(!r)return null;const thr=r.threshold??8,score=r.score==null?'':` ${r.score}/${thr}`;
  if(r.stale)return{cls:'stale',text:`${g==='content'||g==='audio'?g:'Gate '+g} · Hết hiệu lực`,color:'#fb923c'};
  if(r.passed)return{cls:'pass',text:`${g==='content'||g==='audio'?g:'Gate '+g} · Đạt${score}`,color:'#4ade80'};
  if(r.overridden)return{cls:'override',text:`${g==='content'||g==='audio'?g:'Gate '+g} · Chấp nhận${score}`,color:'#fbbf24'};
  if(r.rounds)return{cls:'revise',text:`${g==='content'||g==='audio'?g:'Gate '+g} · Chưa đạt${score}`,color:'#f87171'};
  return{cls:'',text:`${g==='content'||g==='audio'?g:'Gate '+g} · Chưa review`,color:'#64748b'}}
const reviewOk=(v,g)=>!!(v.reviews?.[g]&&(v.reviews[g].passed||v.reviews[g].overridden)&&!v.reviews[g].stale);
function nodeState(v,n){
  if(n.stage)return stageOf(v,n.stage)?.state||'pending';
  if(n.id==='intake')return 'done';
  if((n.id==='join'||n.id==='tasks')&&!Object.keys(v.reviews||{}).length)return 'skipped';  // v1 legacy: no review gates
  // Join is done once the director handed the joined packet to gate E; it starts when every branch review is accepted.
  if(n.id==='join'){if(reviewOk(v,'E')||v.reviews?.E?.rounds)return 'done';const branches=v.flow>=3?['content','audio','D']:['D'];return branches.every(g=>reviewOk(v,g))?'in_progress':'pending'}
  if(n.id==='tasks'){if(reviewOk(v,'B')||v.reviews?.B?.rounds)return 'done';return reviewOk(v,'E')?'in_progress':'pending'}
  if(n.id==='delivery'){const s=summary(v);return s.done===s.total&&s.reviewOk===s.reviewTotal?'done':'pending'}
  return 'pending'}
function agentState(v,name){
  const recs=Object.entries(v.agents||{}).filter(([k])=>k===name||k.replace(/-\d+$/,'')===name).map(([k,r])=>({k,...r}));
  const running=recs.filter(r=>r.state==='running');
  if(running.length)return{state:'running',count:running.length,note:running.map(r=>`${r.k}: ${r.note||r.stage||'đang chạy'} (${short(r.at)})`).join('\n')};
  if(recs.some(r=>r.state==='failed'))return{state:'failed',note:recs.find(r=>r.state==='failed').note};
  // no explicit record: infer from the stages and reviews this agent owns
  const owned=meta.flow.filter(n=>n.agents.includes(name)),reviewing=meta.flow.filter(n=>n.reviewer===name);
  if(owned.some(n=>n.stage&&stageOf(v,n.stage)?.state==='in_progress'))return{state:'running',inferred:true,note:'Suy ra từ stage đang chạy (chưa có lệnh pipeline.py agent)'};
  if(recs.some(r=>r.state==='done'))return{state:'done',note:recs.map(r=>r.note).filter(Boolean).join('; ')};
  if(reviewing.length&&reviewing.every(n=>reviewOk(v,n.gate)))return{state:'done',inferred:true};
  if(owned.length&&owned.every(n=>nodeState(v,n)==='done'))return{state:'done',inferred:true};
  return{state:'idle'}}
function summary(v){const req=v.stages.filter(x=>x.state!=='skipped'),done=req.filter(x=>x.state==='done').length,reviews=Object.values(v.reviews||{}),reviewOkN=Object.keys(v.reviews||{}).filter(g=>reviewOk(v,g)).length,running=meta?meta.agents.filter(a=>a.name!=='video-director'&&agentState(v,a.name).state==='running').length:0;const active=v.stages.some(x=>x.gate==='waiting')?'gate':v.stages.find(x=>['failed','blocked','in_progress'].includes(x.state))?.state||(running?'in_progress':(done===req.length?'done':'pending'));return{done,total:req.length,reviewOk:reviewOkN,reviewPassed:reviews.filter(x=>x.passed&&!x.stale).length,reviewTotal:reviews.length,hasMismatch:v.stages.some(x=>x.mismatch),running,active,percent:req.length?Math.round(done/req.length*100):0}}

// ---- panels ----
function renderList(){document.getElementById('list').innerHTML=`<div class="rail-label">Workspace</div><div class="rail-title">Video đang sản xuất <span>${data.length}</span></div><div class="project-list">${data.map(v=>{const s=summary(v),color=s.active==='done'?'#2dd4bf':s.active==='in_progress'?'#fbbf24':s.active==='gate'?'#a78bfa':'#64748b';return `<button type="button" class="project-card" aria-current="${v.folder===cur}" data-v="${esc(v.folder)}"><span class="project-head"><i class="project-dot ${s.active}"></i><span class="project-name">${esc(v.name)}</span>${s.running?`<span class="project-badge run">${s.running} agent</span>`:''}${s.hasMismatch?'<span class="project-badge">Lệch file</span>':''}</span><span class="project-subtitle"><span>${esc(v.comp)}</span><span>v${esc(v.flow)} · ${s.done}/${s.total}</span></span><span class="project-progress" role="progressbar" aria-label="Tiến độ ${esc(v.name)}" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.done}" style="--project-color:${color}"><span style="width:${s.percent}%"></span></span></button>`}).join('')}</div>`}
function chip(v,name,role,small){const a=meta.agents.find(x=>x.name===name)||{color:'gray',description:''},st=agentState(v,name),c=AGENT_COLOR[a.color]||AGENT_COLOR.gray,label={running:'đang chạy',done:'✓',failed:'lỗi',idle:''}[st.state],initials=name.split('-').map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<span class="agent-chip ${role} ${st.state}${st.inferred?' inferred':''}" style="--c:${c}" title="${esc(name+(role==='reviewer'?' (reviewer)':'')+'\n'+(a.description||'')+(st.note?'\n— '+st.note:''))}" data-agent="${esc(name)}"><span class="av">${initials}</span>${small?'':esc(name)}${st.count>1?`<span class="agent-count">×${st.count}</span>`:''}${label&&!small?`<span class="st">${label}</span>`:''}</span>`}
function orchestration(v){const pod=p=>{const nodes=p.nodes.map(flowNode).filter(Boolean),agentsOf=ns=>{const prod=[...new Set(ns.flatMap(n=>n.agents))].filter(x=>x!=='video-director'),rev=[...new Set(ns.map(n=>n.reviewer).filter(Boolean))];return{prod,rev}};const rows=p.lanes?LANES.map(([lane,title])=>[title,nodes.filter(n=>n.lane===lane)]):[[null,nodes]];const all=agentsOf(nodes),states=[...all.prod,...all.rev].map(n=>agentState(v,n).state),active=states.includes('running'),done=states.length&&states.every(s=>s==='done');const gates=nodes.filter(n=>n.gate).map(n=>{const c=reviewChip(v,n.gate);return c?`<span class="stage-gate ${c.cls}">${esc(c.text)}</span>`:''}).join('');return `<div class="pod${active?' active':''}${done?' done':''}" data-pod><div class="pod-head"><span class="pod-title">${esc(p.title)}</span><span class="pod-gates">${gates}</span></div>${rows.map(([title,ns])=>{const g=agentsOf(ns);return `<div class="lane">${title?`<span class="lane-tag">${esc(title)}</span>`:''}${g.prod.map(n=>chip(v,n,'producer')).join('')}${g.rev.length?'<span class="lane-arrow">→</span>'+g.rev.map(n=>chip(v,n,'reviewer')).join(''):''}</div>`}).join('')}</div>`};
  const known=new Set(meta.flow.flatMap(n=>[...n.agents,n.reviewer]).filter(Boolean)),extra=meta.agents.filter(a=>!known.has(a.name));
  const dir=agentState(v,'video-director'),anyRunning=summary(v).running||v.stages.some(s=>s.state==='in_progress'),hubOn=dir.state==='running'||anyRunning;
  return `<section class="card orchestration-card"><div class="orchestration-title"><strong>Agent Orchestration</strong><span>${meta.agents.length} agent của hệ thống · agent đang chạy sẽ sáng lên</span></div><div class="orchestration-graph" id="orch-graph"><svg class="orchestration-lines" id="orch-lines" aria-hidden="true"></svg><div class="pod-col">${PODS[0].map(pod).join('')}</div><div class="hub-col"><div class="hub${hubOn?' running':''}" id="orch-hub"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="#5eead4"/><circle cx="12" cy="4" r="1.6" fill="#5eead4"/><circle cx="12" cy="20" r="1.6" fill="#5eead4"/><circle cx="4" cy="12" r="1.6" fill="#5eead4"/><circle cx="20" cy="12" r="1.6" fill="#5eead4"/></svg></div><span class="hub-name">video-director</span><span class="hub-state ${hubOn?'running':'idle'}">${hubOn?'đang điều phối':'chờ việc'}</span><span class="hub-role">Luồng chính: dispatch, ghép kết quả, ghi gate, giao video</span>${extra.length?`<div class="lane">${extra.map(a=>chip(v,a.name,'producer')).join('')}</div>`:''}</div><div class="pod-col">${PODS[1].map(pod).join('')}</div></div><div class="orch-legend"><span class="on"><i></i>Đang chạy</span><span style="color:#4ade80"><i></i>Xong</span><span style="color:#64748b"><i></i>Chờ</span><span>□ producer · ○ reviewer · viền đứt = suy ra từ stage</span></div></section>`}
function drawOrchLines(){const g=document.getElementById('orch-graph'),svg=document.getElementById('orch-lines'),hub=document.getElementById('orch-hub');if(!g||!svg||!hub||getComputedStyle(svg).display==='none')return;const gb=g.getBoundingClientRect(),hb=hub.getBoundingClientRect(),hx=hb.left+hb.width/2-gb.left,hy=hb.top+hb.height/2-gb.top;svg.setAttribute('viewBox',`0 0 ${gb.width} ${gb.height}`);svg.innerHTML=[...g.querySelectorAll('[data-pod]')].map(p=>{const b=p.getBoundingClientRect(),left=b.left+b.width/2<hb.left,x=(left?b.right:b.left)-gb.left,y=b.top+b.height/2-gb.top,mx=(x+hx)/2;return `<path class="${p.classList.contains('active')?'active':''}" d="M${hx} ${hy} C ${mx} ${hy}, ${mx} ${y}, ${x} ${y}"/>`}).join('')}
function overview(v,s){const current=v.stages.find(x=>x.state==='in_progress')||meta.flow.find(n=>nodeState(v,n)!=='done');return `<section class="overview-card"><div class="overview-copy"><div class="eyebrow">Production Overview</div><div class="overview-name">${esc(v.name)}</div><div class="overview-meta"><strong>${esc(v.comp)}</strong><span class="flow-badge" title="v3 = 3 nhánh song song + join">workflow v${esc(v.flow)}</span>${v.profile?`<span>${esc(v.profile)}</span>`:''}${v.voice?`<span>· voice ${esc(v.voice)}</span>`:''}<span>·</span><code>docs/${esc(v.folder)}/status.json</code><span>·</span><span>Cập nhật ${fmt(v.updated)}</span></div><div class="next-step"><span class="next-icon"><svg width="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="#5eead4" stroke-width="2"/></svg></span><span><small>Bước tiếp theo</small><b>${esc(v.next||'Chưa ghi bước tiếp theo (pipeline.py set … --next)')}</b></span></div></div><div class="progress-ring" style="--progress:${s.percent}%" role="progressbar" aria-label="Tiến độ stage" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.done}"><span class="ring-copy"><b>${s.percent}%</b><span>stage xong</span></span></div><div class="overview-stats"><span class="stat"><small>Stages</small><b>${s.done}/${s.total}</b></span><span class="stat"><small>Reviews đạt</small><b>${s.reviewPassed}/${s.reviewTotal}</b></span><span class="stat"><small>Agent chạy</small><b>${s.running}</b></span><span class="stat current"><small>Hiện tại</small><b>${esc(current?.label||'Hoàn tất')}</b></span></div></section>`}
function output(v,s){const render=stageOf(v,'render'),ready=render?.state==='done'&&render.evidence?.ok;if(!ready)return '<section class="output-locked"><svg width="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#64748b"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#64748b"/></svg>Video đầu ra sẽ xuất hiện ở đây sau khi render và qua rào chắn cuối (gate C).</section>';const c=reviewOk(v,'C');return `<section class="output-card"><div class="video-frame" id="video-slot"></div><div class="output-copy"><div><div class="eyebrow">Video đầu ra</div><div class="output-title">${esc(render.evidence.files?.[0]?.split('/').pop()||v.name+'.mp4')}</div></div><div class="output-meta"><span>${esc(render.evidence.detail||'')}</span><span>·</span><span>1080×1920</span><span>·</span><span class="${c?'pass':'warn'}">${c?'Đã qua rào chắn cuối (C)':'Chưa qua gate C — chưa giao'}</span><span>·</span><span>${s.reviewPassed}/${s.reviewTotal} review đạt</span></div><div class="output-actions"><button type="button" class="action primary" id="play-output">▶ Xem video</button><a class="action" href="/media/${encodeURIComponent(v.folder)}" download>Tải xuống</a></div></div></section>`}
function stageNode(v,n,num){const st=nodeState(v,n),warn=n.gate&&st==='done'&&['revise','stale'].includes(reviewNodeState(v,n));const agents=n.agents.map(a=>chip(v,a,'producer',true)).join('');return `<button type="button" class="stage-node ${st}${warn?' gate-warn':''}${n.stage?'':' virtual'}" style="--stage-color:${COLOR[st]}" data-s="${esc(n.id)}" aria-pressed="${n.id===sel}"><span class="stage-robot"><i class="stage-number">${num}</i>${bot(COLOR[st])}</span><span class="stage-name">${esc(n.label)}</span><span class="stage-status"><i></i>${LABEL[st]}</span><span class="stage-agents">${agents}</span></button>`}
// Each review is its own node right after its producer: producer → reviewer.
function reviewNodeState(v,n){const r=v.reviews?.[n.gate];if(!r)return 'skipped';if(agentState(v,n.reviewer).state==='running')return 'in_progress';if(r.stale)return 'stale';if((r.passed||r.overridden))return 'done';if(r.rounds)return 'revise';return nodeState(v,n)==='done'?'waiting':'pending'}
function reviewNode(v,n){const st=reviewNodeState(v,n),r=v.reviews?.[n.gate],c=reviewChip(v,n.gate),color=COLOR[st];return `<button type="button" class="stage-node review-node ${st}" style="--stage-color:${color}" data-s="r:${esc(n.id)}" aria-pressed="${'r:'+n.id===sel}" title="${esc(n.reviewer)} chấm ${esc(n.gate)} · ngưỡng ${r?.threshold??''}"><span class="stage-robot"><i class="stage-number">${esc(n.gate.length>1?n.gate[0].toUpperCase()+'·R':n.gate)}</i><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3z" stroke="${color}" stroke-width="1.5" fill="#0e1520"/><path d="m9 12 2 2 4-4" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="stage-name">${esc(n.reviewer)}</span><span class="stage-status"><i></i>${LABEL[st]}</span>${c?`<span class="stage-gate ${c.cls}">${esc(c.text)}</span>`:''}<span class="stage-agents">${chip(v,n.reviewer,'reviewer',true)}</span></button>`}
function pipeline(v,s){const conn=(a,b)=>`<span class="stage-connector ${nodeState(v,flowNode(a))==='done'?'done':''}" aria-hidden="true"></span>`;const rconn=n=>`<span class="stage-connector review ${['done','waiting','in_progress','revise','stale'].includes(reviewNodeState(v,n))&&nodeState(v,n)==='done'?'done':''}" aria-hidden="true"></span>`;const seq=(ids,nums)=>ids.map((id,i)=>{const n=flowNode(id);return (i?conn(ids[i-1],id):'')+stageNode(v,n,nums[i])+(n.gate?rconn(n)+reviewNode(v,n):'')}).join('');const v3=v.flow>=3,laneHtml=LANES.map(([lane,title])=>{const ids=meta.flow.filter(n=>n.lane===lane).map(n=>n.id),nums=ids.map((_,i)=>title.split(' ')[0]+(ids.length>1?'.'+(i+1):'')),active=ids.some(id=>nodeState(v,flowNode(id))==='in_progress');return `<div class="pipeline-lane${active?' active':''}"><span class="lane-name">${esc(title)}</span>${seq(ids,nums)}</div>`}).join('');
  const fork=`<div class="pipeline-fork"><span class="fork-label">${v3?'song song sau gate A':'v2: chạy tuần tự'}</span>${laneHtml}</div>`;const chosen=meta.flow.find(n=>n.id===String(sel).replace(/^r:/,''));
  const body=`${seq(['intake','research','brief','script'],['0','1','2a','2b'])}${conn('script')}${fork}${conn('join')}${seq(['join','tasks','build','qa','render','delivery'],['4–5','6','7','8','9','10'])}`;
  return `<section class="card pipeline-card"><div class="section-head"><div><h2>Production pipeline</h2><p>Gate A → rẽ 3 nhánh song song (content · audio · design) → join + gate E → build → rào chắn cuối C</p></div><span class="counter">${s.done}/${s.total} stage xong</span></div><div class="pipeline-scroll" id="pipe-scroll" tabindex="0" aria-label="Sơ đồ pipeline — cuộn ngang để xem đầy đủ">${body}</div><div class="legend"><span style="color:#4ade80"><i></i>Hoàn tất</span><span style="color:#fbbf24"><i></i>Đang chạy</span><span style="color:#64748b"><i></i>Đang chờ</span><span style="color:#f87171"><i></i>Lỗi / bị chặn</span><span style="color:#a78bfa"><i></i>Chờ review</span><span style="color:#fb923c"><i></i>Review hết hiệu lực</span><span>Ô vuông khiên = node reviewer (chấm gate của bước ngay trước)</span></div>${chosen?detail(v,chosen):''}</section>`}
function detail(v,n){const stage=n.stage?stageOf(v,n.stage):null,r=n.gate?v.reviews?.[n.gate]:null,ag=[...n.agents,n.reviewer].filter(Boolean).map(a=>{const st=agentState(v,a);return `${esc(a)}: ${st.state}${st.inferred?' (suy ra)':''}${st.note?' — '+esc(st.note):''}`}).join('<br>');return `<div class="stage-note"><b>${esc(n.label)}</b>${stage?`<br>Stage <b>${esc(stage.id)}</b>: ${esc(LABEL[stage.state])}${stage.at?' · '+fmt(stage.at):''}${stage.note?'<br>Ghi chú: '+esc(stage.note):''}<br>Bằng chứng: ${stage.evidence?.ok===false?'<span style="color:#f87171">thiếu</span>':esc(stage.evidence?.detail||'')} ${(stage.evidence?.files||[]).map(esc).join(' · ')}`:'<br>Bước điều phối (không có stage riêng trong status.json)'}${r?`<br>Review ${esc(n.gate)}: ${r.score??'—'}/${r.threshold} · ${r.rounds} vòng · ${esc(r.verdict||'chưa review')}${r.stale?' · <span style="color:#fb923c">hết hiệu lực</span>':''}${r.report?' · '+esc(r.report):''}`:''}<br>Agent:<br>${ag}</div>`}
function reviewsAndLogs(v,s){const names=REVIEW_ORDER.filter(g=>v.reviews?.[g]);const rows=names.map(g=>{const r=v.reviews[g],[label,agent]=REVIEW_LABEL[g]||[g,''],c=reviewChip(v,g),state=r.stale?'Hết hiệu lực':r.passed?'Đạt':r.overridden?`Chấp nhận (${esc(r.by||'override')})`:r.rounds?'Chưa đạt':'Chưa review';return `<div class="review-grid${r.kind==='branch'?' branch':''}"><strong>${esc(label)}<small>${esc(agent)}</small></strong><span class="review-state" style="--review-color:${c.color}"><i></i>${state}</span><span class="review-value">${r.score==null?'—':esc(r.score)}<span style="color:var(--faint)"> / ${r.threshold}</span></span><span class="review-value rounds">${r.rounds} vòng</span><span class="review-who" title="${esc(r.reviewer)}">${esc(r.reviewer||'—')}</span>${r.note||r.report?`<div class="review-note">${r.note?esc(r.note)+' ':''}${r.report?`<code>${esc(r.report)}</code>`:''}${r.at?` · ${fmt(r.at)}`:''}</div>`:''}</div>`}).join('');
  const kinds={all:'Tất cả',agent:'Agent',review:'Review'},isReview=x=>/review|^[ADEBC]$|^content$|^audio$|override/.test(x.stage+' '+x.who+' '+x.msg),logs=v.log.filter(x=>logFilter==='all'||(logFilter==='review'?isReview(x):!isReview(x))).slice(0, 40).map(x=>{const col=x.who==='you'||x.who==='user'?'#a78bfa':/review/.test(x.who)||isReview(x)?'#c084fc':x.who==='verify'?'#38bdf8':x.who==='agent'?'#64748b':'#2dd4bf';return `<div class="log-line" style="--log-color:${col}"><span class="log-meta">${fmt(x.t)}</span><span class="log-agent"> ${esc(x.who)}</span><span class="log-tag"> · ${esc(x.stage)}</span><div class="log-msg">${esc(x.msg)}</div></div>`}).join('');
  return `<div class="review-log-grid"><section class="card review-card"><div class="section-head"><div><h2>Review gates</h2><p>${v.flow>=3?'A → [content · audio · D] song song → E → B → C (rào chắn cuối)':'A → D → E → B → C'}</p></div><span class="counter">${s.reviewPassed}/${s.reviewTotal} đạt${s.reviewOk>s.reviewPassed?` · ${s.reviewOk-s.reviewPassed} chấp nhận`:''}</span></div><div class="review-grid header"><span>Gate</span><span>Trạng thái</span><span>Điểm / ngưỡng</span><span class="rounds">Vòng</span><span class="review-who">Reviewer</span></div>${rows||'<div class="empty">Video legacy: chưa có review gate trong status.json.</div>'}</section><section class="card log-card"><div class="log-head"><strong>Nhật ký hoạt động</strong><span class="log-filter">${Object.entries(kinds).map(([k,l])=>`<button type="button" data-log="${k}" aria-pressed="${k===logFilter}">${l}</button>`).join('')}</span></div><div class="log-lines" id="log-lines">${logs||'<div class="empty">Chưa có sự kiện.</div>'}</div></section></div>`}
function gateCards(v){return v.stages.filter(x=>x.gate==='waiting').map(x=>`<section class="card gate-card"><div class="section-head"><div><h2>Cần bạn duyệt · ${esc(x.label)}</h2><p>Pipeline đang tạm dừng tại cổng quyết định</p></div><span class="counter">Action required</span></div><div class="gate-body"><div class="gate-summary"><strong>${esc(x.note||'Agent đã hoàn tất và đang chờ quyết định.')}</strong><div class="gate-files">${x.evidence.files.map(f=>'<code>'+esc(f)+'</code>').join('')}</div></div><div><label for="c-${esc(x.id)}">Ghi chú cho agent</label><textarea id="c-${esc(x.id)}"></textarea><div class="gate-actions"><button class="approve" data-g="${esc(x.id)}" data-d="approved">Duyệt bước này</button><button class="revise" data-g="${esc(x.id)}" data-d="rejected">Yêu cầu sửa</button></div></div></div></section>`).join('')}

// Update each panel only when its HTML changed, so polling never restarts the video or the animations.
function setPart(id,html){const el=document.getElementById(id);if(!el||parts[id]===html)return false;parts[id]=html;el.innerHTML=html;return true}
function renderMain(){const v=data.find(x=>x.folder===cur),main=document.getElementById('main');if(!v){main.innerHTML='<div class="empty">Chưa có video nào trong docs/*/status.json.</div>';Object.keys(parts).forEach(k=>delete parts[k]);return}
  if(!document.getElementById('p-orch')){main.innerHTML='<div class="workspace-inner"><div class="connection-banner" id="connection-banner" role="alert">Mất kết nối với pipeline.</div><div id="p-orch"></div><div id="p-overview"></div><div id="p-output"></div><div id="p-gates"></div><div id="p-pipe"></div><div id="p-review"></div></div>';Object.keys(parts).forEach(k=>delete parts[k])}
  const s=summary(v);const pipeScroll=document.getElementById('pipe-scroll')?.scrollLeft,logScroll=document.getElementById('log-lines')?.scrollTop;
  if(setPart('p-orch',orchestration(v)))requestAnimationFrame(drawOrchLines);
  setPart('p-overview',overview(v,s));
  if(setPart('p-output',output(v,s)))mountVideo(v);
  setPart('p-gates',gateCards(v));
  if(setPart('p-pipe',pipeline(v,s))&&pipeScroll!=null){const el=document.getElementById('pipe-scroll');if(el)el.scrollLeft=pipeScroll}
  if(setPart('p-review',reviewsAndLogs(v,s))&&logScroll!=null){const el=document.getElementById('log-lines');if(el)el.scrollTop=logScroll}}
function mountVideo(v){const slot=document.getElementById('video-slot');if(!slot)return;const video=document.getElementById('result-video-template').content.firstElementChild.cloneNode(true);video.src='/media/'+encodeURIComponent(v.folder);slot.prepend(video);document.getElementById('play-output').onclick=()=>video.play()}
function setConnection(ok){const live=document.getElementById('live');live.className=ok?'live':'live off';live.querySelector('.live-label').textContent=ok?'Đang kết nối trực tiếp':'Mất kết nối';document.getElementById('connection-banner')?.classList.toggle('show',!ok)}
// Selected video survives F5: the URL hash is the source of truth, localStorage the fallback.
function savedVideo(){const h=decodeURIComponent(location.hash.slice(1));if(h)return h;try{return localStorage.getItem('monitor.video')}catch{return null}}
function selectVideo(folder){cur=folder;sel=null;history.replaceState(null,'','#'+encodeURIComponent(folder));try{localStorage.setItem('monitor.video',folder)}catch{}renderList();renderMain()}
async function refresh(){if(busy)return;try{if(!meta){const m=await fetch('/api/meta',{cache:'no-store'});if(!m.ok)throw new Error('meta '+m.status);meta=await m.json()}const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error(response.status);const text=await response.text();setConnection(true);if(text===last)return;last=text;data=JSON.parse(text);if(!cur||!data.some(v=>v.folder===cur)){const want=savedVideo();cur=data.some(v=>v.folder===want)?want:data[0]?.folder??null;if(cur&&!location.hash)history.replaceState(null,'','#'+encodeURIComponent(cur))}renderList();renderMain()}catch(e){console.warn('monitor refresh failed',e);setConnection(false)}}
document.addEventListener('click',async event=>{const project=event.target.closest('[data-v]');if(project){selectVideo(project.dataset.v);return}const stage=event.target.closest('[data-s]');if(stage){sel=sel===stage.dataset.s?null:stage.dataset.s;renderMain();return}const lf=event.target.closest('[data-log]');if(lf){logFilter=lf.dataset.log;renderMain();return}const gate=event.target.closest('[data-g]');if(gate){busy=true;try{const response=await fetch('/api/gate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video:cur,stage:gate.dataset.g,decision:gate.dataset.d,comment:document.getElementById('c-'+gate.dataset.g)?.value||''})});if(!response.ok)throw new Error(response.status);last=''}finally{busy=false;refresh()}}});
window.addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(h&&h!==cur&&data.some(v=>v.folder===h))selectVideo(h)});
window.addEventListener('resize',()=>requestAnimationFrame(drawOrchLines));
cur=savedVideo();refresh();setInterval(refresh,2500);
</script>
</body>
</html>
